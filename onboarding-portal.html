/* Tablet + mobile filter trigger button — same 18/24 rule */
.tablet .gw-filters__icon-btn,
.mobile .gw-filters__icon-btn {
  width: 24px; height: 24px;
  padding: 3px;
  box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center;
}
.tablet .gw-filters__icon-btn .icn,
.mobile .gw-filters__icon-btn .icn {
  width: 18px !important;
  height: 18px !important;
}

/* Search input icon — 18×18, vertically centered. Scoped to the filter
 * search wrapper so non-search icon-wraps are unaffected. */
.gw-filters__search .gwf-icon-wrap.is-left > .gwf-icon {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  top: 50%; transform: translateY(-50%);
  left: 12px;
}
.gw-filters__search .gwf-icon-wrap.is-left > .gwf-icon .icn {
  width: 18px !important;
  height: 18px !important;
}
.gw-filters__search .gwf-icon-wrap.is-left > .gwf-input {
  padding-left: 38px;
}
/* Desktop feed row: search shares the line with every pick on the row. */
.gw-filters:not(.gw-filters--tablet):not(.gw-filters--mobile) .gw-filters__row .gw-filters__search {
  flex: 1 1 278px;
  min-width: 278px;
  max-width: 320px;
}
.gw-filters:not(.gw-filters--tablet):not(.gw-filters--mobile) .gw-filters__row .gw-filters__pick {
  flex: 1 1 150px;
  min-width: 130px;
  max-width: 320px;
}
.gw-filters:not(.gw-filters--tablet):not(.gw-filters--mobile) .gw-filters__more .gw-filters__pick {
  min-width: 280px;
  max-width: 320px;
}
.gw-filters:not(.gw-filters--tablet):not(.gw-filters--mobile) .gwf-select {
  height: 39px;
}
.gw-filters:not(.gw-filters--tablet):not(.gw-filters--mobile) .gw-filters__search .gwf-input {
  height: 39px;
}
/* Search shrinks with the row: inner input and wrapper track the flexed container */
.gw-filters__search { width: 100%; }
.gw-filters__search .gwf-icon-wrap { width: 100%; min-width: 0; }
.gw-filters__search .gwf-input { width: 100%; min-width: 0; box-sizing: border-box; }
/* The absolute floating dropdown panel — let it grow to match its trigger. */
.gw-filters__pick .gw-loc-dropdown { width: 360px; max-width: calc(100vw - 32px); }

/* Make my masked .icn helper fit inside design-system .gws-type containers.
 * Design system says the glyph is 70% of the tile (.gws-type > svg), so
 * match that exactly for the .icn version too. */
.gws-type > .icn { width: 70%; height: 70%; color: #fff; }

/* Alert Counts strip — restore the 12px left margin on the type tile
 * (was previously inline on .gws-type). Scoped to .gw-counts so the
 * data-cell type icons remain flush with the cell's padding. */
.gw-counts .gws-type { margin-left: 12px; }

/* Data-cell type glyph — pin the glyph inside .gws-cell__type to 14×14
 * across all viewports so the cell type icons stay consistent regardless
 * of the surrounding .gws-type tile size. */
.gws-cell__type .gws-type .icn {
  width: 14px !important;
  height: 14px !important;
  -webkit-mask-size: 14px 14px;
  mask-size: 14px 14px;
}

/* Data cell type icon sizing — per design feedback the alert-type tile
 * inside a desktop/tablet data cell is 20×20, smaller than the design
 * system .gws-type--md (28×28). Scoped to .gws-cell__type only so the
 * .gw-counts subheader tiles are not affected. */
.gws-cell--desktop .gws-cell__type .gws-type,
.gws-cell--tablet  .gws-cell__type .gws-type { width: 20px; height: 20px; }

/* Design-system cells — interactive states (cells are buttons in our flow) */
.gws-cell { cursor: pointer; transition: background-color 120ms ease; }
.gws-cell:hover { background: var(--primary-tint); }
.gws-cell:active { background: var(--base-teal-blue-tint); transition-duration: 40ms; }
.gws-cell.is-selected { background: var(--primary-tint); }

/* KPI count tile interactions — when no filter is active, all read full
   opacity; if any are selected, dim the rest. The view layer sets
   `is-active` on selected tiles and `is-dim` on the strip when something
   else is selected. */
.gws-count { transition: opacity 120ms ease; }
.gws-count:hover { opacity: 1; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text-title);
  background: var(--base-darker-blue-gray); /* dark canvas behind device frames */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ----------------------------------------------------------------
   App shell (dark canvas + centered device frame)
---------------------------------------------------------------- */
.app-canvas {
  position: fixed; inset: 0;
  background: var(--base-darker-blue-gray);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
  overflow: auto;
}
/* When Auto mode picks a tablet/mobile layout, let the device frame fill the
 * browser viewport instead of staying boxed inside the centered "device
 * sitting on dark canvas" treatment. */
.app-canvas:has(.frame-tablet),
.app-canvas:has(.frame-mobile) {
  padding: 0;
  background: var(--base-white);
}
.app-canvas:has(.frame-tablet) .frame-tablet,
.app-canvas:has(.frame-mobile) .frame-mobile {
  width: 100%;
  max-width: none;
  height: 100vh;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
/* Hide the iOS status bar + device chrome strip when frame is fullbleed —
 * users in real browsers don't need a fake notch. */
.app-canvas:has(.frame-tablet) .device-statusbar,
.app-canvas:has(.frame-mobile) .device-statusbar { display: none; }

.app-frame { position: relative; }

/* Desktop frame: full viewport, no rounded corners or shadow */
.frame-desktop {
  width: 100%;
  height: 100vh;
  max-width: none;
  background: var(--base-white);
  border-radius: 0;
  overflow: hidden;
  display: flex;
  box-shadow: none;
}

/* Tablet frame: 834x1194 rounded device */
.frame-tablet {
  width: 834px;
  max-width: 100%;
  height: min(1100px, calc(100vh - 48px));
  background: var(--base-white);
  border-radius: 28px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,0.32);
  border: 10px solid #0e1620;
  position: relative;
}

/* Mobile frame: 390x844 */
.frame-mobile {
  width: 390px;
  height: min(844px, calc(100vh - 48px));
  background: #f8f8f8;
  border-radius: 38px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,0.32);
  border: 10px solid #0e1620;
  position: relative;
}

/* iOS / device chrome inside tablet & mobile */
.device-statusbar {
  flex: none;
  height: 47px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px 0 30px;
  font-size: 15px; font-weight: 600;
  color: #000; background: #fff;
}
.device-statusbar .icons { display: flex; gap: 5px; align-items: center; }
.device-statusbar svg { width: 14px; height: 14px; }
.mobile .device-statusbar { padding: 0 28px; }
.device-urlbar {
  flex: none;
  height: 40px;
  background: #f3f3f3;
  border-bottom: 1px solid var(--border-divider);
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 0 12px;
  font-size: 13px; color: var(--text-body);
}
.device-urlbar .lock { font-size: 10px; opacity: 0.6; }

/* ----------------------------------------------------------------
   Header (top bar above the page)
---------------------------------------------------------------- */
.gw-topbar {
  flex: none;
  height: 56px;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border-divider);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.gw-topbar .user {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
}
.gw-topbar .user .name { font-weight: 600; color: var(--text-title); }
.gw-topbar .user .role { color: var(--text-secondary); font-size: 12px; }

/* Page title row */
.gw-pagetitle {
  font-size: 32px; font-weight: 600;
  color: var(--text-title);
  letter-spacing: -0.01em;
}

/* ----------------------------------------------------------------
   Sidebar (desktop)
---------------------------------------------------------------- */
.gw-sidebar {
  flex: none;
  width: 256px;
  background: var(--primary);
  color: var(--text-on-dark);
  display: flex; flex-direction: column;
}
.gw-sidebar .brand {
  padding: 22px 24px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.gw-sidebar .brand img { height: 26px; display: block; }
.gw-sidebar .org {
  padding: 18px 24px 22px;
  display: flex; gap: 12px; align-items: center;
  background: var(--primary-dark);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.gw-sidebar .org .logo {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: #FFCB05;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px;
  color: #B12020; line-height: 1;
  flex: none;
}
.gw-sidebar .org .meta { display: flex; flex-direction: column; gap: 1px; }
.gw-sidebar .org .meta .small { font-size: 12px; opacity: 0.7; }
.gw-sidebar .org .meta .strong { font-size: 16px; font-weight: 600; }
.gw-sidebar .nav { padding: 16px 12px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.gw-sidebar .nav .item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 15px; font-weight: 600;
  color: rgba(255,255,255,0.85);
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}
.gw-sidebar .nav .item:hover { background: var(--primary-hover); color: #fff; }
.gw-sidebar .nav .item.active { background: var(--primary-dark); color: #fff; }
.gw-sidebar .nav .item .icon { width: 18px; height: 18px; flex: none; }
.gw-sidebar .footer {
  padding: 16px 20px 22px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column; gap: 14px;
  align-items: stretch;
}
.gw-sidebar .footer .logo-row {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.gw-sidebar .footer .logo-row img { height: 22px; }
.gw-sidebar .footer .logo-row .pp { font-size: 11px; opacity: 0.6; }
.gw-sidebar .footer .signout {
  background: var(--base-white);
  color: var(--text-title);
  border: none; cursor: pointer;
  height: 40px; border-radius: 6px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.gw-sidebar .footer .signout svg { width: 14px; height: 14px; }

/* ----------------------------------------------------------------
   Main column (content right of sidebar)
---------------------------------------------------------------- */
.gw-main {
  flex: 1;
  min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg-subtle);
}
.gw-main-scroll {
  flex: 1; min-height: 0;
  overflow: auto;
  background: var(--bg-subtle);
}

/* ----------------------------------------------------------------
   Page header (title + filter rows + KPI strip)
---------------------------------------------------------------- */
.gw-page-head {
  background: var(--bg-subtle);
  padding: 14px 0 0;
  border-bottom: 1px solid var(--border-divider);
  position: relative; z-index: 5;
  overflow: visible;
}
.gw-page-head > h1 { margin: 0 24px 12px; font-size: 28px; font-weight: 600; }
.gw-page-head > .gw-filters { padding-bottom: 8px; }

.gw-filter-row {
  display: flex; gap: 12px; align-items: center;
  margin-top: 10px;
}
.gw-filter-row .grow { flex: 1; }
.gw-filter-row .less-toggle {
  flex: none;
  font-size: 13px; font-weight: 600;
  color: var(--secondary-dark);
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  padding: 8px 0;
}
.gw-filter-row .clear-link {
  flex: none;
  font-size: 13px; font-weight: 600;
  color: var(--secondary-dark);
  background: none; border: none; cursor: pointer;
  padding: 8px 0;
}

/* Compact tablet/mobile-shared search + chip row */
.gw-search-input {
  position: relative;
  display: flex; align-items: center;
}
.gw-search-input input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 36px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  font-family: inherit; font-size: 13px;
  background: var(--base-white);
  color: var(--text-title);
  outline: none;
}
.gw-search-input input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,171,200,0.15); }
.gw-search-input .icon {
  position: absolute; left: 11px;
  width: 16px; height: 16px;
  color: var(--text-secondary);
  pointer-events: none;
}
.gw-search-input .filter-btn {
  position: absolute; right: 8px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary); background: none; border: none;
  padding: 0;
}
.gw-search-input .filter-btn:hover { color: var(--secondary-dark); }
.gw-search-input .filter-btn svg { width: 16px; height: 16px; }
.gw-search-input .filter-btn.active { color: var(--secondary-dark); }

/* Select-like control */
.gw-select {
  position: relative;
  height: 36px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  background: var(--base-white);
  display: flex; align-items: center;
  padding: 0 32px 0 12px;
  font-size: 13px; color: var(--text-body);
  cursor: pointer;
  user-select: none;
  min-width: 140px;
}
.gw-select.has-value { color: var(--text-title); font-weight: 600; }
.gw-select.open { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,171,200,0.15); }
.gw-select .chev {
  position: absolute; right: 10px;
  width: 14px; height: 14px;
  color: var(--text-secondary);
}
.gw-select .placeholder { color: var(--text-secondary); }

/* Calendar pill button */
.gw-calendar-btn {
  height: 36px;
  width: 44px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  background: var(--base-white);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  cursor: pointer;
}
.gw-calendar-btn svg { width: 16px; height: 16px; }
.gw-calendar-btn.has-value { color: var(--secondary-dark); border-color: var(--secondary); }

/* ----- Count tile gap + alignment ----------------------------------------
 * Design system .gws-count default gap is 8px between the tile and the
 * label/value column. Per design feedback we want 12px gap *between the
 * icon and the divider* on the strip surface — bump it here. */
.gw-counts .gws-count { gap: 12px; }
.gw-counts .gws-count-row > .gws-count { padding: 0 16px; }
.gw-counts .gws-count-row > .gws-count:first-child { padding-left: 0; }
.gw-counts .gws-count-row > .gws-count:last-child  { padding-right: 0; }
 * system (status.css: .gws-count + .gws-count-row + .gws-type--md).
 * This selector only adds the strip's surface chrome (background,
 * padding, hover/active states) and a layout hook for tablet to spread
 * the tiles across the device width. */
.gw-counts {
  padding: 12px 24px;
  background: var(--base-pale-cyan);
  border-top: 1px solid var(--border-divider);
}
.gw-counts .gws-count { cursor: pointer; transition: opacity 120ms ease; }
.gw-counts.has-selection .gws-count:not(.is-active) { opacity: 0.5; }
.gw-counts .gws-count:hover { opacity: 1; }

/* Tablet: spread counts evenly across the device width — each tile
 * sizes to its content, the row distributes them with space-between. */
.tablet .gw-counts { padding: 10px 20px; }
.tablet .gw-counts .gws-count-row {
  display: flex; width: 100%;
  justify-content: space-between;
  align-items: center;
}
.tablet .gw-counts .gws-count-row > .gws-count {
  flex: 0 0 auto;
  min-width: 0;
  justify-content: flex-start;
}

/* Mobile: design-system .gws-count-row--mobile owns layout */
.mobile .gw-counts { padding: 8px 12px; }
.gw-kpi {
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  padding: 6px 10px 6px 6px;
  border-radius: 6px;
  transition: background 120ms ease;
  flex: none;
}
.gw-kpi:hover { background: rgba(0,0,0,0.03); }
.gw-kpi.active { background: var(--primary-light); }
.gw-kpi .badge {
  width: 38px; height: 38px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-on-dark);
}
.gw-kpi .badge svg { width: 18px; height: 18px; }
.gw-kpi .meta { display: flex; flex-direction: column; line-height: 1.15; }
.gw-kpi .meta .label { font-size: 11px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.gw-kpi .meta .value { font-size: 22px; font-weight: 700; color: var(--text-title); }

/* ----------------------------------------------------------------
   Body — alert list
---------------------------------------------------------------- */
.gw-body {
  padding: 16px 24px 24px;
  display: flex; flex-direction: column;
  gap: 14px;
}

/* Store card */
.gw-store {
  background: var(--base-white);
  border-radius: 8px;
  border: 1px solid var(--border-divider);
  overflow: hidden;
}
.gw-store-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--bg-store);
  cursor: pointer;
}
.gw-store-head .icon {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--base-red);
  color: #fff;
  font-size: 10px; font-weight: 900;
  flex: none;
}
.gw-store-head .icon img { width: 20px; height: 20px; border-radius: 4px; }
.gw-store-head .name { font-weight: 700; font-size: 15px; color: var(--text-title); }
.gw-store-head .addr { color: var(--text-secondary); font-size: 13px; }
.gw-store-head .chev { margin-left: auto; color: var(--text-secondary); width: 16px; height: 16px; flex: none; }

.gw-store-body { display: flex; flex-direction: column; }

/* Alert row inside a store card (desktop / tablet) */
.gw-alert-row {
  display: grid;
  grid-template-columns: 200px 1fr auto auto auto;
  gap: 16px;
  align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--border-divider);
  cursor: pointer;
  transition: background 120ms ease;
}
.gw-alert-row:hover { background: var(--base-pale-cyan); }
.gw-alert-row.selected { background: var(--primary-tint); }
.gw-alert-row .type-cell {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 14px;
  color: var(--text-title);
}
.gw-alert-row .type-cell .type-icon {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  flex: none;
}
.gw-alert-row .type-cell .type-icon svg { width: 16px; height: 16px; }
.gw-alert-row .desc {
  font-size: 14px; color: var(--text-body);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.gw-alert-row .desc .lead { font-weight: 600; color: var(--text-title); }
.gw-alert-row .desc .lead .dim { color: var(--text-secondary); font-weight: 400; }
.gw-alert-row .desc .dim { color: var(--text-secondary); }
.gw-alert-row .validator {
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.gw-alert-row .validator .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.gw-alert-row .top-sku { color: var(--alert-indicator-top-sku); cursor: pointer; }
.gw-alert-row .status-pill {
  font-size: 12px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
}
.gw-alert-row .time {
  font-size: 13px; color: var(--text-secondary);
  white-space: nowrap;
  text-align: right;
  min-width: 70px;
}

/* ----------------------------------------------------------------
   Status pill (standalone)
---------------------------------------------------------------- */
.status-pill {
  display: inline-flex;
  align-self: flex-start;
  font-size: 12px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ----------------------------------------------------------------
   Detail panel (desktop slide-in)
---------------------------------------------------------------- */
.detail-overlay {
  position: absolute; inset: 0;
  background: rgba(19,30,41,0.4);
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
  z-index: 30;
}
.detail-overlay.open { opacity: 1; pointer-events: auto; }
.detail-panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 480px;
  background: var(--base-white);
  box-shadow: -8px 0 24px rgba(0,0,0,0.16);
  transform: translateX(100%);
  transition: transform 240ms ease;
  z-index: 31;
  display: flex; flex-direction: column;
}
.detail-panel.open { transform: translateX(0); }
.detail-panel .close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px;
  border-radius: 6px; border: none; background: none;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
}
.detail-panel .close:hover { background: var(--bg-subtle); color: var(--text-title); }
.detail-panel .close svg { width: 16px; height: 16px; }
.detail-panel .escalated-banner {
  position: absolute; top: 14px; left: 24px; right: 60px;
  background: var(--tertiary-light);
  border: 1px dashed var(--tertiary);
  color: var(--tertiary-dark);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  z-index: 1;
}

/* ----------------------------------------------------------------
   Alert detail body — Figma "Tablet/Alert Details" structure
   Header (type + time, store, category + vendor + status), then notes,
   photo, optional item list / repair info / acceptance info.
---------------------------------------------------------------- */
.detail-body {
  flex: 1; min-height: 0; overflow: auto;
  padding: 0;
  display: flex; flex-direction: column; gap: 0;
}

/* ----- Header ----- */
.detail-head {
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 14px 24px 16px;
  border-bottom: 1px solid var(--border-divider);
}
.detail-head__row { display: flex; align-items: center; }
.detail-head__row--top {
  justify-content: space-between;
}
.detail-head__type {
  display: flex; align-items: center; gap: 8px;
}
.detail-head__type-label {
  font-size: 16px; font-weight: 700; color: var(--text-title);
}
.detail-head__time {
  font-size: 16px; color: var(--text-body);
}
.detail-head__row--store {
  gap: 6px; margin-top: 2px;
}
.detail-head__retailer {
  width: 24px; height: 24px; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  overflow: hidden; flex: 0 0 24px;
}
.detail-head__retailer img { width: 100%; height: 100%; display: block; }
.detail-head__store-name {
  font-size: 20px; font-weight: 700; color: var(--text-title); line-height: 1.2;
}
.detail-head__addr {
  font-size: 16px; color: var(--text-body); line-height: 1.4;
}
.detail-head__row--vendor {
  justify-content: space-between;
  margin-top: 8px;
}
.detail-head__vendor { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.detail-head__cat {
  font-size: 16px; color: var(--text-body); line-height: 1.4;
}
.detail-head__vendor-name {
  font-size: 20px; font-weight: 700; color: var(--text-title); line-height: 1.2;
}

/* ----- Section (Alert Notes, Acceptance Info) ----- */
.detail-section {
  display: flex; flex-direction: column;
  gap: 6px;
  padding: 14px 24px;
}
.detail-section__title {
  font-size: 16px; font-weight: 700; color: var(--text-title);
}
.detail-section__body {
  margin: 0;
  font-size: 14px; line-height: 1.5; color: var(--text-body);
}

.detail-divider {
  height: 1px; background: var(--border-divider);
  margin: 0 24px;
}

/* ----- Photo thumbnails + viewer dialog ----- */
.detail-photos { display: flex; gap: 10px; flex-wrap: wrap; }
/* Mobile: thumbnails stay on one line and shrink to fit instead of wrapping */
.mobile .detail-photos { flex-wrap: nowrap; }
.mobile .detail-photos .detail-photo--thumb { flex: 1 1 0; min-width: 0; max-width: 104px; aspect-ratio: 1; height: auto; }
.detail-photo--thumb { padding: 0; cursor: pointer; }
.detail-photo--thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-photo--thumb:hover { box-shadow: 0 0 0 2px var(--secondary); }
.detail-photo--thumb::after { content: none; }
.photo-viewer { position: fixed; inset: 0; z-index: 200; background: rgba(19, 30, 41, 0.85); display: flex; align-items: center; justify-content: center; padding: 32px; }
.photo-viewer img { max-width: min(92%, 960px); max-height: 88%; border-radius: 6px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5); }
.photo-viewer__close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.15); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.photo-viewer__close:hover { background: rgba(255, 255, 255, 0.28); }
/* Device frames: keep the dialog inside the tablet/mobile frame */
.app-frame { position: relative; }
.detail-photo {
  flex: none;
  width: 96px; height: 72px;
  border-radius: 6px;
  margin: 12px 24px 12px;
  background-image: linear-gradient(135deg, #b6c4cf 0%, #6b7a86 100%);
  position: relative; overflow: hidden;
}
.detail-photo::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 12px),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0 2px, transparent 2px 14px);
}

/* ----- Item list (Need More Product / Credit) ----- */
.detail-list {
  display: flex; flex-direction: column;
  padding: 0;
}
.detail-list__head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 24px;
  border-bottom: 1px solid var(--border-divider);
}
.detail-list__head-label {
  font-size: 16px; font-weight: 700; color: var(--text-title);
}
.detail-list__head-remove {
  font-size: 12px; font-weight: 700; color: var(--btn-danger-bg);
  cursor: pointer;
}
.detail-list__row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 24px;
  border-bottom: 1px solid var(--border-divider);
}
.detail-list__row:last-child { border-bottom: 0; }
.detail-list__left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.detail-list__name {
  font-size: 16px; font-weight: 700; color: var(--text-title);
  display: flex; align-items: center; gap: 6px;
}
.detail-list__topsku {
  font-size: 12px; font-weight: 700;
  color: var(--alert-indicator-top-sku);
}
.detail-list__sku {
  font-size: 14px; color: var(--text-body);
  display: flex; align-items: center; gap: 6px;
}
.detail-list__sku .dot {
  display: inline-block; width: 4px; height: 4px;
  border-radius: 50%; background: currentColor; opacity: 0.85;
}

/* ----- Acceptance Information section (Accepted / Completed alerts) ----- */
.detail-acceptance__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.detail-acceptance__time {
  font-size: 16px; color: var(--text-body);
}
.detail-acceptance__eta {
  display: flex; flex-direction: column; gap: 2px;
}
.detail-acceptance__eta-value {
  font-size: 20px; font-weight: 700; color: var(--text-title); line-height: 1.2;
}

/* ----- Escalation reason banner (Escalated alerts) -----
 * Pinkish/purple callout placed after the photo, before Acceptance Info.
 * Symmetric padding + icon vertically aligned with the text block. */
.detail-escalation {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 20px;
  background: var(--alert-status-escalated-bg);
  border-radius: 6px;
  min-height: 64px;
  box-sizing: border-box;
}
.detail-escalation__icon {
  color: var(--alert-status-escalated-fg);
  flex: 0 0 24px;
  width: 24px; height: 24px;
  display: inline-flex; align-items: center; justify-content: center;
}
.detail-escalation__text {
  display: flex; flex-direction: column;
  gap: 4px;
  flex: 1; min-width: 0;
}
.detail-escalation__label {
  font-size: 14px;
  color: var(--alert-status-escalated-fg);
  line-height: 1.4;
}
.detail-escalation__reason {
  font-size: 16px; font-weight: 700;
  color: var(--alert-status-escalated-fg);
  line-height: 1.4;
}

/* ----- Grid (label / value pairs used in Repair / Acceptance sections) ----- */
.detail-credit-items {
  display: flex; flex-direction: column;
  gap: 12px;
  margin-top: 4px;
}
.detail-credit-item {
  display: flex; flex-direction: column;
  gap: 6px;
  padding-bottom: 12px;
}
.detail-credit-item.has-divider { border-bottom: 1px solid var(--border-divider); }
.detail-credit-item__row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px;
}
.detail-credit-item__name {
  font-size: 16px; font-weight: 700; color: var(--text-title);
}
.detail-credit-item__qty {
  display: flex; flex-direction: column; align-items: flex-end;
}
.detail-credit-item__reason {
  display: flex; flex-direction: column; gap: 2px;
}
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.detail-grid__col { display: flex; flex-direction: column; gap: 4px; }
.detail-grid__label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.detail-grid__value { font-size: 14px; font-weight: 700; color: var(--text-title); }

/* Action button row at bottom of detail */
.detail-actions {
  flex: none;
  padding: 16px 24px;
  border-top: 1px solid var(--border-divider);
  background: var(--base-white);
}
.detail-actions button {
  width: 100%;
  height: 44px;
  border-radius: 6px;
  font-family: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}
.btn-escalate {
  background: transparent;
  color: var(--btn-escalated-bg);
  border: 1px solid var(--btn-escalated-bg);
}
.btn-escalate:hover { background: var(--tertiary-light); }
.btn-reopen {
  background: var(--base-white);
  color: var(--btn-danger-bg);
  border: 1px solid var(--btn-danger-bg);
}
.btn-reopen:hover { background: var(--base-light-red); }
.detail-actions { display: flex; gap: 12px; }
.btn-verify {
  background: var(--primary);
  color: #fff;
  border: 0;
}
.btn-verify:hover { background: var(--primary-hover); }
/* ---- Re-open confirmation dialog ---- */
.gw-confirm { background: var(--base-white); border-radius: 10px; padding: 24px; width: min(92%, 400px); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5); }
.gw-confirm__title { font-size: 18px; font-weight: 700; color: var(--text-title); }
.gw-confirm__body { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--text-body); }
.gw-confirm__actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
.gw-confirm__cancel { height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--base-white); color: var(--text-title); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; width: auto !important; }
.gw-confirm__cancel:hover { background: var(--bg-subtle); }
.gw-confirm__go { height: 40px; padding: 0 18px; border-radius: 6px; border: 0; background: var(--btn-danger-bg); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; width: auto !important; }
.gw-confirm__go:hover { opacity: 0.9; }
.gw-confirm__go:disabled { opacity: 0.45; cursor: default; }
/* Escalation reason choices */
.gw-esc-reasons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.gw-esc-reason { text-align: left; padding: 14px 16px; border-radius: 8px; border: 1.5px solid var(--alert-status-escalated-fg); background: var(--base-white); color: var(--alert-status-escalated-fg); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.gw-esc-reason:hover { background: var(--alert-status-escalated-bg); }
/* Verify satisfaction choices */
.gw-verify-choices { display: flex; gap: 12px; margin-top: 20px; }
.gw-verify-choice { flex: 1 1 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px 10px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--base-white); }
.gw-verify-choice--good { border: 1.5px solid var(--alert-status-completed-fg); color: var(--alert-status-completed-fg); }
.gw-verify-choice--good:hover { background: var(--alert-status-completed-bg); }
.gw-verify-choice--good .icn { color: var(--alert-status-completed-fg); }
.gw-verify-choice--bad { border: 1.5px solid var(--btn-danger-bg); color: var(--btn-danger-bg); }
.gw-verify-choice--bad:hover { background: var(--base-light-red); }
.gw-verify-choice--bad .icn { color: var(--btn-danger-bg); }
.gw-confirm__reason { width: 100%; margin-top: 14px; border: 1px solid var(--border-default); border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 14px; line-height: 1.45; background: var(--base-white); color: var(--text-title); resize: vertical; box-sizing: border-box; }
.gw-confirm__reason::placeholder { color: var(--text-secondary); }
.gw-confirm__reason:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,171,200,0.15); }
.detail-panel__topbtns { position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 4px; z-index: 5; }
.detail-panel__topbtns .close { position: static; }
.detail-screen-head .gw-delete-btn { margin-left: auto; }
.gw-delete-btn { border: 0; background: transparent; padding: 0; width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; border-radius: 4px; }
.gw-delete-btn:hover { color: var(--btn-danger-bg); background: var(--base-light-red); }
.gw-delete-btn .icn { color: currentColor; }

/* Location filter dropdown — absolute overlay sized for the tree.
 * Wider than the trigger and floats above content via high z-index.
 * Explicitly position:absolute so it never participates in flow. */
.gw-filters__pick .gw-loc-dropdown {
  position: absolute !important;
  top: 44px; left: 0;
  width: 320px;
  max-width: calc(100vw - 32px);
  max-height: 70vh;
  overflow: auto;
  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(19,30,41,0.18);
  z-index: 200;
}

/* The trigger is the positioning context for the panel. */
.gw-filters__pick { position: relative; }
/* Header must not clip the panel, but must not grow either. */
.gw-page-head { overflow: visible; }
.gw-filters,
.gw-filters__row,
.gw-filters__more { overflow: visible; }

/* ----------------------------------------------------------------
   Calendar (date picker)
   ---------------------------------------------------------------- */
.gw-cal {
  width: 320px;
  font-family: var(--font-sans);
  padding: 12px;
  display: flex; flex-direction: column;
  gap: 8px;
}
.gw-cal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px;
}
.gw-cal__title {
  font-size: 15px; font-weight: 700;
  color: var(--text-title);
}
.gw-cal__nav {
  width: 28px; height: 28px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  background: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-body);
  cursor: pointer;
}
.gw-cal__nav:hover { background: var(--bg-subtle); color: var(--primary); border-color: var(--primary); }
.gw-cal__dow {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 0;
}
.gw-cal__dow-cell {
  font-size: 12px; font-weight: 700;
  color: var(--text-secondary);
  text-align: center;
  padding: 4px 0;
}
.gw-cal__grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.gw-cal__day {
  height: 36px;
  border: 0; background: transparent;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text-title);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.gw-cal__day:hover {
  background: var(--bg-subtle);
}
.gw-cal__day.is-muted {
  color: var(--text-secondary);
  opacity: 0.5;
}
.gw-cal__day.is-today {
  border: 1px solid var(--primary);
}
.gw-cal__day.is-disabled {
  color: var(--text-secondary);
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}
.gw-cal__nav.is-disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}
.gw-cal__day.is-selected {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
}
.gw-cal__day.is-selected:hover { background: var(--primary-dark); }
.gw-cal__foot {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border-divider);
  padding-top: 8px;
}
.gw-cal__clear, .gw-cal__today {
  border: 0; background: transparent;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
}
.gw-cal__clear { color: var(--text-body); }
.gw-cal__today { color: var(--primary); }
.gw-cal__clear:hover, .gw-cal__today:hover { background: var(--bg-subtle); }

/* Calendar panel inside a filter pick — sized to wrap the calendar with
 * no clipping. The dropdown defers to the calendar's intrinsic width. */
.gw-loc-dropdown.gw-loc-dropdown--cal {
  padding: 0;
  width: auto;
  max-width: none;
  max-height: none;
  overflow: visible;
}
.gw-filters__pick .gw-loc-dropdown.gw-loc-dropdown--cal { width: auto; }
.gw-loc-dropdown.gw-loc-dropdown--cal .gw-cal { width: 340px; }

   ---------------------------------------------------------------- */

.gw-loc-search { margin: 8px 12px 4px; }

.gw-loc-row:hover { background: var(--bg-subtle); }

.gw-loc-row__chev--empty { visibility: hidden; cursor: default; }

.gw-loc-row__cb {

  font-size: 14px; font-weight: 600; color: var(--text-title);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ----------------------------------------------------------------

.gw-loc-dropdown {
  position: absolute;
  z-index: 50;
  background: var(--base-white);
  border: 1px solid var(--border-divider);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(19,30,41,0.16);
  min-width: 240px;
  max-height: 320px;
  overflow: auto;
  padding: 8px 6px;
  display: flex; flex-direction: column;
  gap: 2px;
}
.gw-loc-option {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13px; color: var(--text-title);
  cursor: pointer;
}
.gw-loc-option:hover { background: var(--bg-subtle); }
.gw-loc-option.selected { background: var(--primary-tint); font-weight: 600; }
.gw-loc-option .check {
  width: 14px; height: 14px;
  border: 1.5px solid var(--border-default);
  border-radius: 3px; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.gw-loc-option.selected .check { background: var(--secondary); border-color: var(--secondary); }
.gw-loc-option.selected .check::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
.gw-loc-tree { display: flex; flex-direction: column; gap: 0; }
.gw-loc-node {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px; color: var(--text-title);
}
.gw-loc-node:hover { background: var(--bg-subtle); }
.gw-loc-node.selected { background: var(--primary-tint); font-weight: 600; }
.gw-loc-node .twirl { width: 12px; height: 12px; flex: none; color: var(--text-secondary); }
.gw-loc-node .twirl.empty { visibility: hidden; }
.gw-loc-children { display: flex; flex-direction: column; padding-left: 18px; }

/* ----------------------------------------------------------------
   Generic icon helper
---------------------------------------------------------------- */
.icn {
  display: inline-block;
  width: 16px; height: 16px;
  background: currentColor;
  -webkit-mask: var(--m) center/contain no-repeat;
  mask: var(--m) center/contain no-repeat;
  flex: none;
}

/* ----------------------------------------------------------------
   Tablet-specific tweaks

  display: inline-block;
}

  padding: 14px;

  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);

/* ----------------------------------------------------------------

.gw-chipsearch:focus-within { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,171,200,0.15); }

.gw-searchchip { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-tint); border: 1px solid var(--secondary); color: var(--primary-dark); border-radius: 4px; padding: 3px 6px 3px 8px; font: 600 13px/1.2 var(--font-sans); white-space: nowrap; }
.gw-searchchip button { border: 0; background: none; padding: 2px; margin: 0; display: inline-flex; align-items: center; color: inherit; cursor: pointer; }
.gw-searchchip button:hover { color: var(--btn-danger-bg); }


/* ----------------------------------------------------------------
 * LABEL / VALUE GRID — read-only field pairs (Alert Details sub-issue

 * ---------------------------------------------------------------- */
.gwf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.gwf-grid--1 { grid-template-columns: 1fr; }
.gwf-grid + .gwf-grid { margin-top: 12px; }
.gwf-grid--divided { padding-bottom: 12px; border-bottom: 1px solid var(--border-divider); }
.gwf-grid__col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

/* ----------------------------------------------------------------

 * ---------------------------------------------------------------- */
.gwf-days { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.gwf-day { min-width: 34px; height: 28px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--bg-white); color: var(--text-secondary); font: 700 12px/1 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; }

/* ----------------------------------------------------------------

.gwf-input:disabled, .gwf-select:disabled, .gwf-textarea:disabled,
.gwf-input.is-disabled, .gwf-select.is-disabled, .gwf-textarea.is-disabled { background: var(--base-pale-cyan); color: var(--text-secondary); border-color: var(--border-default); cursor: not-allowed; opacity: .6; }

<style data-page="portal">

   Variants: User = retailer | distributor | system; State = expanded | collapsed.

   ---------------------------------------------------------------- */

/* ---------- Frame --------------------------------------------------- */

.gws-side--collapsed { width: var(--gws-side-w-col); align-items: center; }

.gws-side-head {
  background: var(--gws-side-bg-header);
  border-bottom: 1px solid var(--gws-side-divider);

}

.gws-side--collapsed .gws-side-head { width: 100%; height: 80px; padding: 0; }

  height: 64px;
  display: flex; align-items: center; gap: 8px;
}

.gws-side-retailer .gws-rlogo {

  display: flex; flex-direction: column; gap: 4px;
  padding: 16px;
  overflow: hidden;
}
.gws-side--collapsed .gws-side-nav { padding: 16px 6px; align-items: center; }

/* ---------- Nav item (expanded width 224×56) ----------------------- */
.gws-nav {
  position: relative;
  height: 56px; width: 224px;
  border-radius: 4px;
  display: flex; align-items: center; gap: 8px;
  padding: 16px;

}
.gws-nav .gws-nav-trail { width: 24px; height: 24px; margin-left: auto; }
.gws-nav .gws-nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.gws-nav:hover                    { background: var(--gws-side-bg-hover); }
.gws-nav.is-active,
.gws-nav[aria-current="page"]     { background: var(--gws-side-bg-active); }

/* expanded "section" with sub-nav */
.gws-nav-group {
  width: 224px; border-radius: 4px;
  background: var(--gws-side-bg-nav);
  overflow: hidden;

.gws-nav-group .gws-nav { width: 100%; }
.gws-nav-group__sub {
  display: flex; flex-direction: column; gap: 2px;

  background: var(--gws-side-bg-nav);

.gws-nav-group__sub .gws-nav {
  width: 100%; height: 40px; padding: 8px 12px; font-size: 14px;

.gws-nav-group__sub .gws-nav:hover { background: var(--gws-side-bg-hover); }
.gws-nav-group__sub .gws-nav.is-active,
.gws-nav-group__sub .gws-nav[aria-current="page"] { background: var(--gws-side-bg-active); font-weight: 600; }

/* A group row opens and closes its sub-nav; it is never the current page.

.gws-nav-group > .gws-nav,
.gws-nav-group > .gws-nav.is-active,
.gws-nav-group > .gws-nav[aria-current="page"] { background: var(--gws-side-bg-nav); }

.gws-nav-group:has(.gws-nav-group__sub [aria-current="page"]) > .gws-nav .gws-nav-label { font-weight: 600; }
