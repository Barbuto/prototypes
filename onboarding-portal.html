.ob-row + .ob-row, .ob-item + .ob-item { border-top: 1px solid var(--border-divider); }
.ob-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ob-row-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 17.5px; font-weight: 600; }
.ob-row-sub { font-size: 14px; color: var(--text-body); }
.ob-row.off .ob-row-title { color: var(--text-body); font-weight: 400; }
.ob-row.locked { background: var(--base-pale-cyan); }
.ob-typeicon { flex: none; width: 36px; height: 36px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.ob-row.off .ob-typeicon { opacity: .45; }
.ob-group-label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-body); margin: 0 0 8px; }
.ob-disclose { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 4px; background: var(--bg-white); font-size: 14px; font-weight: 600; color: var(--primary-dark); cursor: pointer; }
.ob-disclose:hover { border-color: var(--primary); }
.ob-issues { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 4px 24px; padding: 8px 18px 16px 68px; background: var(--bg-white); }
.ob-check { display: flex; align-items: center; gap: 14px; min-height: 36px; font-size: 16px; font-weight: 600; color: var(--text-title); cursor: pointer; }

.sw { flex: none; position: relative; width: 44px; height: 26px; padding: 0; border: 0; border-radius: 999px; background: var(--base-gray); cursor: pointer; transition: background .15s; }
.sw.on { background: var(--primary); }
.sw:disabled { opacity: .5; cursor: not-allowed; }
.sw-knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on .sw-knob { transform: translateX(18px); }

.ob-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-md); background: var(--bg-tint); color: var(--primary-dark); font-size: 15px; }
.ob-field { display: flex; flex-direction: column; gap: 8px; }
.ob-field label, .ob-field-label { font-size: 16px; font-weight: 600; color: var(--text-title); }
.ob-input { height: 56px; padding: 0 16px; border: 1px solid var(--base-gray); border-radius: var(--radius-md); font: 400 24.5px/1.2 var(--font-sans); color: var(--text-title); background: var(--bg-white); }
.ob-input:focus { outline: 3px solid var(--secondary); outline-offset: 1px; border-color: var(--primary); }
.ob-logo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ob-logo-thumb { height: 48px; max-width: 160px; object-fit: contain; border: 1px solid var(--border-divider); border-radius: var(--radius-md); padding: 4px; background: var(--bg-white); }
.ob-head-title img { height: 24px; max-width: 96px; object-fit: contain; }
.ob-error { font-size: 15px; font-weight: 600; color: var(--danger); margin: 0; }
.ob-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--text-body); }

/* Buttons */
.ob-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ob-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border: 0; border-radius: var(--radius-md); background: var(--btn-primary-bg); color: #fff; font-size: 17.5px; font-weight: 600; cursor: pointer; text-decoration: none; }
.ob-btn:hover { background: var(--btn-primary-hover); }
.ob-btn:disabled { background: var(--base-light-gray); color: var(--base-dark-gray); cursor: not-allowed; }
.ob-btn.ghost { background: transparent; color: var(--primary-dark); border: 1px solid var(--border-default); }
.ob-btn.ghost:hover { border-color: var(--primary); background: var(--base-pale-cyan); }
.ob-hint { font-size: 14px; color: var(--text-body); }
.ob-hint kbd { font-family: inherit; font-weight: 700; color: var(--text-title); }
.ob-link { background: none; border: 0; padding: 0; font-size: 15px; font-weight: 600; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ob-link:hover { color: var(--primary-dark); }

.ob-nav { position: fixed; right: 24px; bottom: 24px; z-index: 10; display: flex; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-2); }
.ob-nav button { width: 44px; height: 44px; border: 0; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.ob-nav button + button { border-left: 1px solid rgba(255,255,255,.3); }
.ob-nav button:hover { background: var(--primary-hover); }
.ob-nav button:disabled { background: var(--base-light-gray); color: var(--base-dark-gray); cursor: not-allowed; }

/* Form details */
.ob-form { border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; }
.ob-form + .ob-form { margin-top: 10px; }
.ob-form-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; background: var(--bg-white); border: 0; text-align: left; cursor: pointer; color: inherit; font-size: 17.5px; font-weight: 600; }
.ob-form-head:hover { background: var(--base-pale-cyan); }
.ob-form-head:focus-visible { outline: 3px solid var(--secondary); outline-offset: -3px; }
.ob-form-head .count { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--text-body); }
.ob-form-body { border-top: 1px solid var(--border-divider); }
/* Dropdown options editor (portal · Form details) */
.ob-opts { display: flex; flex-direction: column; gap: 10px; padding: 12px 18px 16px 24px; background: var(--base-pale-cyan); border-top: 1px solid var(--border-divider); }
.ob-opts + .ob-row { border-top: 1px solid var(--border-divider); }
.ob-opts-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-body); }
.ob-opts ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ob-opts li { display: flex; align-items: center; gap: 6px; }
.ob-opt-input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--base-gray); border-radius: var(--radius-md); background: var(--bg-white); font: 400 16px/1.2 var(--font-sans); color: var(--text-title); }
.ob-opt-input:focus, .ob-iconbtn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 1px; border-color: var(--primary); }
.ob-iconbtn { flex: none; width: 40px; height: 40px; padding: 0; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-white); color: var(--text-body); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.ob-iconbtn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary-dark); }
.ob-iconbtn.danger { color: var(--danger); }
.ob-iconbtn:disabled { opacity: .4; cursor: not-allowed; }
.ob-opts-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
/* Type-ahead: whose options are being edited */
.ob-form:has(.ob-combo-list) { overflow: visible; }
.ob-combo { position: relative; display: flex; flex-direction: column; gap: 6px; }
.ob-combo label { font-size: 14px; font-weight: 600; color: var(--text-body); }
.ob-combo-field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border: 1px solid var(--base-gray); border-radius: var(--radius-md); background: var(--bg-white); color: var(--text-body); }
.ob-combo-field:focus-within { outline: 3px solid var(--secondary); outline-offset: 1px; border-color: var(--primary); }
.ob-combo-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 16px/1.2 var(--font-sans); color: var(--text-title); }
.ob-combo-field input::placeholder { color: var(--text-secondary); }
.ob-combo-clear { flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--text-body); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.ob-combo-clear:hover { background: var(--bg-tint); }
.ob-opts .ob-combo-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; display: block; margin: 4px 0 0; padding: 4px; max-height: 264px; overflow: auto; background: var(--bg-white); border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-3); }
.ob-opts .ob-combo-list li { display: block; }
.ob-combo-list button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 40px; padding: 6px 10px; border: 0; border-radius: 4px; background: none; font: 400 16px/1.2 var(--font-sans); color: var(--text-title); text-align: left; cursor: pointer; }
.ob-combo-list button:hover, .ob-combo-list button:focus-visible { background: var(--bg-tint); outline: none; }
.ob-combo-list button[aria-selected="true"] { font-weight: 600; }
.ob-combo-clear:focus-visible, .ob-chip:focus-visible { outline: 3px solid var(--secondary); outline-offset: 1px; }
.ob-opts .ob-combo-list li.ob-combo-none { padding: 10px; font-size: 14px; color: var(--text-body); }
.ob-opts-hint { margin: 0; font-size: 14px; color: var(--text-body); }
.ob-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--text-body); }
.ob-chip { height: 28px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 999px; background: var(--bg-white); font: 600 13px/1 var(--font-sans); color: var(--primary-dark); cursor: pointer; }
.ob-chip:hover, .ob-chip[aria-pressed="true"] { border-color: var(--primary); background: var(--bg-tint); }
.ob-form-nested { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px 18px; border-top: 1px solid var(--border-divider); background: var(--base-pale-cyan); }
.ob-form-nested .ob-form { background: var(--bg-white); }
.ob-form-nested .ob-form + .ob-form { margin-top: 0; }
.ob-form-body .ob-row { padding-left: 24px; min-height: 56px; }
.ob-lock { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text-body); }

/* Review */
.ob-review { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
.ob-review-main { flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.ob-review-side { flex: 1 1 375px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: sticky; top: 96px; }
.ob-sum { display: flex; gap: 16px; padding: 16px 0; border-top: 1px solid var(--border-divider); }
.ob-sum:last-child { border-bottom: 1px solid var(--border-divider); }
.ob-sum-num { flex: none; width: 24px; font-size: 14px; font-weight: 700; color: var(--primary); padding-top: 2px; }
.ob-sum-body { flex: 1; min-width: 0; }
.ob-sum-label { font-size: 14px; font-weight: 600; color: var(--text-body); }
.ob-sum-value { font-size: 17.5px; font-weight: 600; margin-top: 2px; }
.ob-sum-detail { font-size: 15px; color: var(--text-body); margin-top: 2px; }
.ob-sum-detail ul { margin: 6px 0 0; padding-left: 18px; }

/* Phone preview — mirrors the Alert Creation mobile screens (pick screens, form, CTA bar) */
.ph-caption { font-size: 14px; color: var(--text-body); text-align: center; max-width: 280px; }
.ph { --gwc-stroke: #CBD5E1; width: 375px; max-width: 100%; height: min(780px, calc(100vh - 150px)); min-height: 600px; border: 10px solid var(--base-darker-blue-gray); border-radius: 40px; background: var(--bg-white); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-3); }
.ph-head { flex: none; position: relative; height: 44px; margin-top: 18px; display: flex; align-items: center; padding: 0 14px; background: var(--bg-white); border-bottom: 1px solid var(--border-divider); }
.ph-back { display: flex; align-items: center; gap: 4px; height: 44px; border: 0; background: none; padding: 0; color: var(--secondary-dark); font: 600 14px/1 var(--font-sans); cursor: pointer; }
.ph-title { position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 124px); font-size: 16px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-pick { flex: 1; min-height: 0; overflow: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 8px; }
.ph-pick > *, .ph-form > *, .ph-section > * { flex-shrink: 0; }
.ph-type-row { display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 12px; background: var(--bg-white); border: 1px solid var(--border-divider); border-radius: var(--radius-md); font: 600 16px/1.2 var(--font-sans); color: var(--text-title); text-align: left; cursor: pointer; }
.ph-type-row:hover { background: var(--bg-subtle); border-color: var(--border-default); }
.ph-type-row .label { flex: 1; min-width: 0; }
.ph-type-row .chev { color: var(--text-secondary); }
.ph-type { flex: none; width: 28px; height: 28px; border-radius: 2.8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.ph-prompt { font-size: 16px; font-weight: 600; color: var(--text-title); padding: 8px 0 6px; }
.ph-pill { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 40px; padding: 4px 16px; border: 1px solid var(--primary); border-radius: var(--radius-pill); background: var(--bg-white); color: var(--primary); font: 600 14px/1.2 var(--font-sans); text-align: center; cursor: pointer; }
.ph-pill:hover { background: var(--primary-tint); }
.ph-type-row:focus-visible, .ph-pill:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.ph-form { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 24px; background: var(--bg-white); }
.ph-select { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 39px; padding: 0 12px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); font-size: 16px; color: var(--text-secondary); }
.ph-select span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-input { height: 39px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); }
.ph-vendor { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 6px 2px 8px; border-bottom: 1px solid var(--border-divider); }
.ph-vendor .l { font-size: 13px; color: var(--text-secondary); }
.ph-vendor .v { font-size: 16px; color: var(--text-secondary); }
.ph-section { display: flex; flex-direction: column; gap: 8px; }
.ph-label { font-size: 16px; font-weight: 600; color: var(--text-title); }
.ph-sublabel { font-size: 14px; color: var(--text-secondary); line-height: 1.3; margin: -8px 0 2px; }
.ph-notes { min-height: 88px; padding: 10.5px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); font-size: 16px; line-height: 1.4; color: var(--text-secondary); }
.ph-help { font-size: 14px; line-height: 1.4; color: var(--text-secondary); }
.ph-addphoto, .ph-scanbtn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border: 1px solid var(--primary-light); border-radius: var(--radius-md); background: var(--bg-white); color: var(--primary); font-size: 16px; font-weight: 600; }
.ph-scanbtn { height: 40px; gap: 10px; border-color: #A6CBD8; font-size: 18px; }
.ph-checks { display: flex; flex-direction: column; gap: 14px; padding-top: 2px; }
.ph-check { display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 600; color: var(--text-title); }
.ph-check i { flex: none; width: 22px; height: 22px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-sm); background: var(--bg-white); }
.ph-notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--tertiary-light); color: var(--tertiary-dark); font-size: 14px; font-weight: 600; line-height: 1.35; }
.ph-cta { flex: none; padding: 16px 24px; border-top: 1px solid var(--border-divider); background: var(--bg-white); box-shadow: 0 -2px 8px rgba(19,30,41,.08); }
.ph-cta span { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: var(--radius-md); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-size: 16px; font-weight: 600; opacity: .5; }
.ph { position: relative; }
/* Picker drawer — the design system's filter sheet (styles.css .gw-filter-sheet, mobile): 75% black scrim,
   panel at the default drawer height of 66.67% of the phone, 56px head, 18px title, 16px close glyph;
   option rows as Alert Creation's .gwc-option */
.ph-sheet { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .75); }
.ph-sheet-panel { display: flex; flex-direction: column; width: 100%; height: 66.6667%; max-height: 66.6667%; background: #fff; border-radius: 12px 12px 0 0; box-shadow: 0 -1px 3px rgba(0, 0, 0, .3); }
.ph-sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 14px 16px; }
.ph-sheet-title { font-size: 18px; font-weight: 700; line-height: 100%; color: var(--text-title); }
.ph-sheet-close { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-title); }
.ph-sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 12px; }
.ph-option { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 10px 4px; font-size: 16px; font-weight: 600; color: var(--text-title); }
.ph-empty { font-size: 14px; color: var(--text-body); text-align: center; padding: 24px 8px; }
/* Filled states + item-level scanning cart (Product identification step) */
.ph-back.static { cursor: default; }
.ph-type-row.static, .ph-pill.static { cursor: default; }
.ph-type-row.static:hover { background: var(--bg-white); border-color: var(--border-divider); }
.ph-pill.static:hover { background: var(--bg-white); }
.ph-select.filled { border-color: var(--primary); color: var(--text-title); }
.ph-vendor.ready { flex-direction: row; align-items: center; gap: 12px; }
.ph-vendor .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-vendor.ready .v { font-weight: 600; color: var(--text-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-vendor-edit { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--gwc-stroke); background: var(--bg-white); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; }
.ph-notes.filled { color: var(--text-body); }
.ph-sizes { display: flex; flex-direction: column; margin-top: 2px; }
.ph-sizes-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--gwc-stroke); font-size: 16px; color: var(--text-body); }
.ph-sizes-row:last-child { border-bottom: 0; }
.ph-seg { display: inline-flex; flex: none; border: 1px solid var(--gwc-stroke); border-radius: 999px; background: var(--bg-white); padding: 2px; }
.ph-seg span { display: inline-flex; align-items: center; justify-content: center; height: 32px; min-width: 58px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-body); }
.ph-seg span.on { background: var(--primary); color: #fff; }
.ph-countrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0; }
.ph-countrow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-countrow .n { font-size: 16px; font-weight: 600; color: var(--text-title); }
.ph-countrow .h { font-size: 14px; color: var(--text-secondary); line-height: 1.3; }
.ph-qty { flex: none; display: inline-flex; align-items: stretch; height: 39px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-white); color: var(--text-secondary); }
.ph-qty span { width: 32px; display: inline-flex; align-items: center; justify-content: center; }
.ph-qty b { width: 40px; display: inline-flex; align-items: center; justify-content: center; border-left: 1px solid var(--gwc-stroke); border-right: 1px solid var(--gwc-stroke); font-size: 16px; font-weight: 600; color: var(--text-title); }
.ph-scansearch { flex: none; padding: 8px 16px 10px; background: var(--bg-white); border-bottom: 1px solid var(--border-divider); }
.ph-scansearch div { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 16px; white-space: nowrap; overflow: hidden; }
.ph-scanbody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; background: var(--bg-white); }
.ph-scanbody > * { flex-shrink: 0; }
.ph-scanempty { padding: 40px 32px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--text-title); }
.ph-cartgroup { padding: 12px 20px 14px; border-bottom: 1px solid var(--border-divider); display: flex; flex-direction: column; gap: 10px; }
.ph-cartgroup-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ph-cartgroup-head .vendor { font-size: 16px; font-weight: 700; color: var(--text-title); }
.ph-textbtn { border: 0; background: transparent; padding: 0; min-height: 24px; cursor: pointer; font: 600 14px/1 var(--font-sans); color: var(--primary); }
.ph-textbtn:hover { text-decoration: underline; }
.ph-cartitem { display: flex; align-items: center; gap: 12px; min-height: 45px; }
.ph-cartitem .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-cartitem .n { font-size: 16px; font-weight: 600; color: var(--text-title); line-height: 1.25; }
.ph-cartitem .m { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-body); white-space: nowrap; overflow: hidden; }
.ph-cartitem .m i { width: 4px; height: 4px; border-radius: 999px; background: currentColor; opacity: .7; flex: none; }
.ph-cartremove { border: 0; background: transparent; padding: 4px; cursor: pointer; color: var(--danger); display: inline-flex; flex: none; }
.ph-textbtn:focus-visible, .ph-cartremove:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.ph-cta span.ready { opacity: 1; }
.ph-cta.scan { display: flex; gap: 12px; padding: 16px 20px; }
.ph-cta.scan span { flex: 1; min-width: 0; gap: 8px; font-size: 14px; white-space: nowrap; }
.ph-cta.scan span.outline { opacity: 1; background: var(--bg-white); color: var(--primary); border: 1px solid var(--primary); }
/* Real form controls (inputs, steppers, radios, time and day pickers) as in Alert Creation */
.ph-inputbox { display: flex; align-items: center; gap: 12px; min-width: 0; height: 39px; padding: 0 12px; border: 1px solid var(--gwc-stroke); border-radius: var(--radius-md); background: var(--bg-white); color: var(--text-secondary); font-size: 16px; }
.ph-inputbox .fix { flex: none; font-weight: 600; }
.ph-inputbox .p { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-divider { height: 1px; background: var(--gwc-stroke); }
.ph-check.radio { min-height: 36px; }
.ph-check.radio i { border-radius: 999px; }
.ph-checks.tight { gap: 4px; padding-top: 0; }
.ph-check.rich { margin-top: 14px; }
.ph-check.rich .t { display: flex; flex-direction: column; gap: 2px; }
.ph-check.rich .h { font-size: 14px; font-weight: 400; color: var(--text-secondary); line-height: 1.3; }
.ph-money { flex: none; width: 120px; }
.ph-money .ph-inputbox { height: 44px; padding: 0 10px; gap: 6px; }
.ph-money.temp { width: 96px; }
.ph-section.times { gap: 16px; }
.ph-time { display: flex; flex-direction: column; gap: 8px; }
.ph-time-row { display: flex; align-items: center; gap: 8px; }
.ph-time-row .box { width: 64px; height: 39px; border: 1px solid var(--gwc-stroke); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-secondary); }
.ph-time-row .colon { font-size: 18px; font-weight: 600; color: var(--text-title); }
.ph-time-row .ap { display: inline-flex; align-items: center; gap: 8px; height: 39px; padding: 0 12px 0 14px; border: 1px solid var(--gwc-stroke); border-radius: 6px; font-size: 16px; color: var(--text-title); }
.ph-time-row .ap .icn { color: var(--text-secondary); }
.ph-daypicker { display: flex; flex-direction: column; gap: 4px; }
.ph-days { display: flex; justify-content: space-between; gap: 6px; margin-top: 4px; }
.ph-days span { flex: 1 1 0; max-width: 44px; aspect-ratio: 1; border: 1px solid var(--gwc-stroke); border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--text-body); }
.ph-product { display: flex; flex-direction: column; gap: 12px; }
.ph-product-row { display: flex; gap: 12px; align-items: stretch; }
.ph-product-row .ph-inputbox { flex: 1; }
.ph-qty span.remove { color: var(--danger); }
.ph-addproduct { align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 14px; border: 1px solid var(--primary-light); border-radius: var(--radius-pill); background: var(--bg-white); color: var(--primary); font-size: 16px; font-weight: 600; }
.ph-req { font-weight: 400; color: var(--text-secondary); }
.ph-vendorbar { flex: none; padding: 12px 20px 10px; background: var(--bg-white); border-bottom: 1px solid var(--border-divider); }
.ph-scanland { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px 40px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--text-title); }
.ph-scanland .ph-scanbtn { padding: 0 28px; }
.ob-btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }

/* Done */
.ob-done { align-items: flex-start; }
.ob-done-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--base-light-green); color: var(--base-deep-green); display: inline-flex; align-items: center; justify-content: center; }

@media (max-width: 720px) {
  .ob-head-row { padding: 12px 16px; }
  .ob-head-title { display: none; }
  .ob-main { padding: 32px 16px 110px; }
  .ob-q h1 { font-size: 28px; }
  .ob-issues { padding-left: 18px; }
  .ob-review-side { position: static; }
}

/* ------------------------------------------------------------------ */
/* Portal — layout only. The shell is the design system's own:         */
/* styles.css (.frame-desktop, .gw-main, .gw-topbar, .gw-page-head,    */
/* .gw-export-btn, .gw-confirm, .gw-toast), src/sidebar.css (.gws-side) */
/* and src/stores-nav.css (.gw-backlink).                              */
/* ------------------------------------------------------------------ */
body.pt-body { background: var(--bg-white); }
.pt .gws-side { flex: none; height: 100%; }
.pt .gws-side-nav { overflow: auto; }
.pt .gws-side-retailer .gws-rmeta .gws-rname, .pt .gws-side-retailer .gws-rmeta .gws-rstore { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt .gws-nav:focus-visible, .pt .gws-side-foot__signout:focus-visible { outline: 3px solid var(--secondary); outline-offset: -3px; }
/* Trailing chevron on the nav group: 12px, smaller than the 16px start-slot icon (the inline size is the component's 20px) */
.pt .gws-nav .gws-nav-trail .icn { width: 12px !important; height: 12px !important; }
.pt a.gw-backlink { text-decoration: none; }
.pt .gw-backlink:focus-visible, .pt .gw-export-btn:focus-visible, .pt-btn:focus-visible, .pt .gw-confirm button:focus-visible, .pt .gw-toast__close:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.pt .gw-topbar .user .role { color: var(--text-body); }
/* Page header + body share one centred column, as tight as the onboarding's */
.pt .gw-page-head__row, .pt-sub, .pt-body-wrap { max-width: 1264px; margin-left: auto; margin-right: auto; padding-left: 32px; padding-right: 32px; }
.pt .gw-page-head__row { margin-top: 0; margin-bottom: 4px; flex-wrap: wrap; }
.pt .gw-page-head__row h1 { font-weight: 700; }
.pt-sub { margin-top: 0; margin-bottom: 14px; font-size: 14px; color: var(--text-body); }
.pt-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pt-unsaved { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--warning); white-space: nowrap; }
.pt-unsaved i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pt-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 6px; border: 1px solid var(--btn-primary-bg); background: var(--btn-primary-bg); color: var(--btn-primary-text); font: 600 14px/1 var(--font-sans); cursor: pointer; }
.pt-btn:hover { background: var(--btn-primary-hover); border-color: var(--btn-primary-hover); }
.pt-btn:disabled, .pt .gw-export-btn:disabled { opacity: .5; cursor: not-allowed; }
.pt-body-wrap { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; padding-top: 32px; padding-bottom: 64px; }
.pt-panel { flex: 999 1 480px; min-width: 0; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
.pt-body-wrap .ob-review-side { top: 32px; }
.pt .ph { height: min(780px, calc(100vh - 270px)); }
.pt-sample { margin: 0; }
.pt-sample a { color: var(--primary-dark); font-weight: 600; }
.pt-scrim { position: fixed; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(19, 30, 41, .55); }
.pt-scrim .gw-confirm { width: min(100%, 440px); }
.pt-scrim .gw-confirm__go.primary { background: var(--btn-primary-bg); }
.pt-scrim .gw-confirm__go.primary:hover { background: var(--btn-primary-hover); opacity: 1; }
.pt-changes { margin: 10px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: var(--text-body); }

/* Alert Mapping table */
.pt-panel.wide { max-width: none; }
.pt-map { display: flex; flex-direction: column; gap: 16px; }
.pt-map-tools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pt-map-tools .ob-combo-field { width: min(360px, 100%); }
.pt-map-count { font-size: 14px; color: var(--text-body); }
/* The table has no scroll of its own: it scrolls with the page (.gw-main-scroll), and the head row pins to the top of
   that scroll. A table wider than the panel grows the frame, and the page scrolls sideways. */
.pt-table-wrap { overflow: visible; align-self: flex-start; box-sizing: border-box; width: max-content; min-width: 100%; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-white); }
/* Pagination under the mapping table */
.pt-pager { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pt-pager-count { font-size: 14px; color: var(--text-body); }
.pt-pager-nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pt-pager-btn { height: 36px; min-width: 36px; padding: 0 12px; border: 1px solid var(--border-default); border-radius: 4px; background: var(--bg-white); font: 600 14px/1 var(--font-sans); color: var(--primary-dark); cursor: pointer; }
.pt-pager-btn.num { padding: 0 6px; border-color: transparent; }
.pt-pager-btn:hover:not(:disabled):not(.is-current) { background: var(--base-pale-cyan); }
.pt-pager-btn.is-current { background: var(--primary); border-color: var(--primary); color: #fff; cursor: default; }
.pt-pager-btn:disabled { color: var(--text-body); opacity: .6; cursor: not-allowed; }
.pt-pager-btn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.pt-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 16px; }
.pt-table thead th:first-child { border-top-left-radius: calc(var(--radius-lg) - 1px); }
.pt-table thead th:last-child { border-top-right-radius: calc(var(--radius-lg) - 1px); }
.pt-table tbody tr:last-child > :first-child { border-bottom-left-radius: calc(var(--radius-lg) - 1px); }
.pt-table tbody tr:last-child > :last-child { border-bottom-right-radius: calc(var(--radius-lg) - 1px); }
.pt-table th, .pt-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-divider); text-align: center; vertical-align: middle; }
.pt-table thead th { padding: 14px 12px 12px; background: var(--base-pale-cyan); font-size: 14px; font-weight: 600; line-height: 1.25; color: var(--text-title); vertical-align: middle; min-width: 116px; position: sticky; top: 0; z-index: 2; border-bottom: 0; box-shadow: inset 0 -1px 0 var(--border-divider); }
.pt-table th:first-child { text-align: left; min-width: 220px; padding-left: 18px; }
.pt-table tbody th { font-weight: 600; color: var(--text-title); }
.pt-table tbody tr:last-child > * { border-bottom: 0; }
.pt-table tbody tr:not(.pt-detail):hover > * { background: var(--base-pale-cyan); }
/* Icon inline at the start of the alert type label, centred on it. */
.pt-th { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: left; }
.pt-th .pt-th-icon { flex: 0 0 24px; width: 24px; height: 24px; border-radius: 4px; }
.pt-th-text { display: block; min-width: 0; }
.pt-rowsub { display: block; font-size: 13px; font-weight: 400; color: var(--text-body); }
.pt-cellcheck { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; cursor: pointer; }
.pt-cellbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 4px; background: var(--bg-white); font: 600 14px/1 var(--font-sans); color: var(--primary-dark); white-space: nowrap; cursor: pointer; }
.pt-cellbtn.none { font-weight: 400; color: var(--text-body); }
.pt-cellbtn:hover, .pt-cellbtn[aria-expanded="true"] { border-color: var(--primary); background: var(--bg-tint); }
.pt-cellbtn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.pt-table .pt-detail td { background: var(--base-pale-cyan); text-align: left; padding: 14px 18px 16px; }
.pt-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 16px; font-weight: 600; }
.pt-detail-links { display: inline-flex; gap: 16px; }
.pt-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 4px 24px; }
.pt-table .pt-none { padding: 24px; color: var(--text-body); }
.ob-link.sm { font-size: 13px; }
.ob-link:disabled { color: var(--text-body); text-decoration: none; cursor: not-allowed; }
.pt-rowname { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Alcohol tag — the design system's neutral outlined chip (.gws-status--sm + .gws-alcohol) */
.pt-alc { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: 4px; background: var(--bg-white); color: var(--base-blue-gray); box-shadow: inset 0 0 0 1px var(--border-default); font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; }
/* Fixed, narrow column: the alert type columns share the remaining width */
.pt-table .pt-alc-col, .pt-table thead th.pt-alc-col { width: 72px; min-width: 72px; max-width: 72px; padding-left: 6px; padding-right: 6px; border-right: 1px solid var(--border-divider); }

/* Alert Resolution */
.pt-res-methods { display: flex; flex-direction: column; gap: 2px; padding: 12px 18px 10px 24px; border-bottom: 1px solid var(--border-divider); background: var(--bg-white); }
.pt-radio { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 6px 0; cursor: pointer; }
.pt-radio .t { display: block; font-size: 16px; font-weight: 600; color: var(--text-title); }
.pt-radio .h { display: block; font-size: 14px; color: var(--text-body); }

/* Communication Preferences */
.pt-sections { display: flex; flex-direction: column; gap: 16px; }
.pt-sections h2.ob-group-label { margin: 0 0 8px; }
.pt-sublabel { margin: 14px 0 8px; }
.pt-stepwrap { flex: none; display: inline-flex; align-items: center; gap: 10px; }
.pt-stepwrap.disabled { opacity: .5; }
.pt-unit { min-width: 68px; font-size: 14px; color: var(--text-body); }
.pt-stepper { display: inline-flex; align-items: stretch; height: 40px; border: 1px solid var(--base-gray); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-white); }
.pt-stepper button { width: 40px; padding: 0; border: 0; background: transparent; color: var(--text-body); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.pt-stepper button:hover:not(:disabled) { background: var(--bg-tint); color: var(--primary-dark); }
.pt-stepper button:disabled { opacity: .4; cursor: not-allowed; }
.pt-stepper input { width: 52px; padding: 0; border: 0; border-left: 1px solid var(--border-default); border-right: 1px solid var(--border-default); background: transparent; text-align: center; font: 600 16px/1 var(--font-sans); color: var(--text-title); }
.pt-stepper button:focus-visible, .pt-stepper input:focus-visible { outline: 3px solid var(--secondary); outline-offset: -3px; }
/* Checkbox rows (escalation reasons); the control itself is styled at the end of this file */
.pt-checkrow { min-height: 52px; gap: 14px; cursor: pointer; }

/* ------------------------------------------------------------------ */
/* Checkboxes and radios — the design system control as Alert Creation */
/* draws it (.gwc-check__box / .gwc-radio__dot): 22px box, 1px stroke, */
/* 4px radius, white; checked = primary fill with the white check      */
/* glyph (assets/icons/check.svg); hover = primary stroke. Radios are  */
/* the same box, round, with a 12px primary dot. One rule for every    */
/* checkbox and radio in the onboarding and the portal.                */
/* ------------------------------------------------------------------ */
.ob-check input, .pt-cellcheck input, .pt-checkrow input, .pt-radio input {
  -webkit-appearance: none; appearance: none; flex: none; box-sizing: border-box; width: 22px; height: 22px; margin: 0;
  border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-white) center / 14px auto no-repeat;
  cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease;
}
.ob-check:hover input, .pt-cellcheck:hover input, .pt-checkrow:hover input, .pt-radio:hover input { border-color: var(--primary); }

.ob-check input:focus-visible, .pt-cellcheck input:focus-visible, .pt-checkrow input:focus-visible, .pt-radio input:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.pt-radio input { border-radius: 999px; margin-top: 1px; }
.pt-radio input:checked { border-color: var(--primary); background-image: radial-gradient(circle, var(--primary) 0 6px, transparent 6.5px); background-size: 100% 100%; }

/* Settings pages without a phone preview: the header and body share a narrower centred column (880px of
   content), and the settings fill it, so they are wider than beside a preview (720px) with no empty space
   to their right. Alert Mapping keeps the full width for its table. */
.pt-narrow .gw-page-head__row, .pt-narrow .pt-sub, .pt-narrow .pt-body-wrap { max-width: 944px; }
.pt-narrow .pt-panel { max-width: none; }

/* Page header: title and description stack on the left; the save actions centre vertically against both */
.pt .gw-page-head .gw-page-head__row { align-items: center; margin-bottom: 14px; }
.pt-headtext { flex: 1 1 320px; min-width: 0; }
.pt .gw-page-head .pt-headtext .pt-sub { max-width: none; margin: 4px 0 0; padding: 0; }

/* Dropdown — design system trigger (.gwf-select) and panel (.gw-loc-dropdown / .gw-loc-option); only the
   placement and the button resets live here */
.pt-dd { position: relative; flex: none; }
.pt-dd .gwf-select { height: 39px; text-align: left; font-family: var(--font-sans); }
/* Placed from the trigger's position. The panel look is stated here in full (same values as the design
   system's .gw-loc-dropdown) so it is always a solid white surface, whatever else is loaded. */
.pt-dd-menu { position: fixed; z-index: 1100; box-sizing: border-box; min-width: 0; max-height: 320px; overflow: auto; display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; background: #fff; border: 1px solid var(--border-divider); border-radius: 6px; box-shadow: 0 8px 24px rgba(19, 30, 41, .16); }
.pt-dd-menu .gw-loc-option { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px; font-size: 13px; color: var(--text-title); cursor: pointer; }
.pt-dd-menu .gw-loc-option:hover { background: var(--bg-subtle); }
.pt-dd-menu .gw-loc-option.selected { background: var(--primary-tint); font-weight: 600; }
button.gw-loc-option { width: 100%; border: 0; background: transparent; font-family: var(--font-sans); text-align: left; }
button.gw-loc-option:focus-visible, .pt-dd .gwf-select:focus-visible { outline: 3px solid var(--secondary); outline-offset: 1px; }

</style>
