body{margin:0;background:#fff}
a{color:#00866A}a:hover{color:#006B55}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid #00B289;outline-offset:2px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-size:16px;font-weight:500;text-align:left;transition:background .15s}
.nav:hover{background:#18403F}
.nav.sub{font-weight:400;min-height:40px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#0F172A;font-size:14px;font-weight:600;transition:background .15s}
.ghost:hover{background:#F1F5F9}
.icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:8px;background:transparent;color:#64748B;transition:background .15s,color .15s}
.icon:hover{background:#F1F5F9;color:#0F172A}
.icon:has(input:focus-visible){outline:2px solid #00B289;outline-offset:2px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:8px;background:#00866A;color:#fff;font-size:14px;font-weight:600;transition:background .15s}

.mitem:hover{background:#F1F5F9}

.chipx:hover{background:rgba(0,0,0,.08)}

.legend:hover{background:#F1F5F9}
.fab{transition:transform .15s,box-shadow .15s}
.fab:hover{transform:scale(1.05);box-shadow:0 12px 28px rgba(0,0,0,.28)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dot{width:5px;height:5px;border-radius:50%;background:#00866A;animation:blink 1.2s infinite}
.caret{display:inline-block;width:8px;height:18px;margin-left:2px;vertical-align:-3px;background:#00B289;animation:blink 1s infinite}
.in{animation:rise .25s ease-out}

/* Minimal renderer for the prototype: {{holes}}, <sc-if>, <sc-for>, on* events, DOM morphing. */
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };

  var tpl, comp, mount, queued = false;

  function schedule() {
    if (queued || !comp) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; render(); });
  }

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function interp(str, scope) {
    return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }

  function eventType(el, name) {
    var t = name.slice(2).toLowerCase();
    if (t === 'change') {
      var tag = el.localName, type = (el.getAttribute('type') || '').toLowerCase();
      if (tag === 'textarea' || (tag === 'input' && ['checkbox', 'radio', 'file'].indexOf(type) < 0)) return 'input';
    }
    return t;
  }

  function bind(el, type) {
    el.__bound = el.__bound || {};
    if (el.__bound[type]) return;
    el.__bound[type] = true;
    el.addEventListener(type, function (e) { var h = el.__on && el.__on[type]; if (h) h(e); });
  }

  function build(node, scope, inSvg, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'helmet') return;
    if (tag === 'sc-if') {
      if (lookup(WHOLE.exec(node.getAttribute('value'))[1], scope)) kids(node, scope, inSvg, out);
      return;
    }
    if (tag === 'sc-for') {
      var list = lookup(WHOLE.exec(node.getAttribute('list'))[1], scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        kids(node, s, inSvg, out);
      });
      return;
    }
    var svg = inSvg || tag === 'svg';
    var el = svg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
    var props = {};
    el.__on = {};
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, raw = a.value;
      if (name.indexOf('hint-') === 0 || name === 'xmlns') continue;
      var m = WHOLE.exec(raw);
      if (/^on[A-Z]/.test(name)) {
        var fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') { var t = eventType(node, name); el.__on[t] = fn; bind(el, t); }
        continue;
      }
      var val = m ? lookup(m[1], scope) : interp(raw, scope);
      if (name === 'value' || name === 'checked') { props[name] = val; continue; }
      if (val === false || val == null) continue;
      el.setAttribute(name, val === true ? '' : String(val));
    }
    var children = [];
    kids(node, scope, svg, children);
    children.forEach(function (c) { el.appendChild(c); });
    el.__props = props;
    applyProps(el, props);
    out.push(el);
  }

  function kids(node, scope, inSvg, out) {
    for (var c = node.firstChild; c; c = c.nextSibling) build(c, scope, inSvg, out);
  }

  function applyProps(el, props) {
    if ('value' in props) { var v = props.value == null ? '' : String(props.value); if (el.value !== v) el.value = v; }
    if ('checked' in props) { var c = !!props.checked; if (el.checked !== c) el.checked = c; }
  }

  function same(a, b) {
    if (a.nodeType !== b.nodeType) return false;
    if (a.nodeType === 3) return true;
    return a.localName === b.localName && a.namespaceURI === b.namespaceURI &&

  function morph(live, next) {
    if (live.nodeType === 3) { if (live.nodeValue !== next.nodeValue) live.nodeValue = next.nodeValue; return; }
    var i, a;
    for (i = live.attributes.length - 1; i >= 0; i--) { a = live.attributes[i]; if (!next.hasAttribute(a.name)) live.removeAttribute(a.name); }
    for (i = 0; i < next.attributes.length; i++) { a = next.attributes[i]; if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value); }
    live.__on = next.__on;
    Object.keys(next.__on || {}).forEach(function (t) { bind(live, t); });
    morphChildren(live, next);
    applyProps(live, next.__props || {});
  }

  function morphChildren(live, next) {
    var a = Array.prototype.slice.call(live.childNodes), b = Array.prototype.slice.call(next.childNodes);
    for (var i = 0; i < b.length; i++) {
      if (i >= a.length) live.appendChild(b[i]);
      else if (same(a[i], b[i])) morph(a[i], b[i]);
      else live.replaceChild(b[i], a[i]);
    }

  }

  function render() {
    var active = document.activeElement, focusId = active && active.id, sel = null;
    if (focusId && 'selectionStart' in active) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }

      return { id: el.getAttribute('data-autoscroll'), stick: el.scrollTop + el.clientHeight >= el.scrollHeight - 60 };
    });

    var vals = comp.renderVals();
    var out = [];
    kids(tpl, vals, false, out);
    var holder = document.createElement('div');
    out.forEach(function (n) { holder.appendChild(n); });
    morphChildren(mount, holder);

    if (focusId && document.activeElement !== document.getElementById(focusId)) {
      var el = document.getElementById(focusId);
      if (el && document.body.contains(el)) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }

      var el = document.querySelector('[data-autoscroll="' + b.id + '"]');

  }

  window.__dcStart = function (markup, Component) {
    var doc = new DOMParser().parseFromString('<root>' + markup + '</root>', 'application/xml');
    var err = doc.getElementsByTagName('parsererror')[0];

function k$(n) { return '$' + (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'K'; }
function usd(n) { return '$' + n.toLocaleString('en-US'); }

function chatName(message) {
  const cleaned = message.trim().toLowerCase();
  const cap = function (w) { return w.charAt(0).toUpperCase() + w.slice(1); };
  if (cleaned.length < 20) return message.trim().split(/\s+/).map(cap).join(' ');
  const stop = ['the','a','an','and','or','but','in','on','at','to','for','of','with','by','how','what','when','where','why','can','could','would','should','will','is','are','was','were','be','been','have','has','had','do','does','did','i','you','we','they','me','us','them','my','your','our','their','me','show','give'];
  const words = cleaned.replace(/[^a-z0-9\s-]/g, '').split(/\s+/).filter(function (w) { return w.length > 2 && stop.indexOf(w) < 0; }).slice(0, 4);
  if (!words.length) return 'New Chat';
  const name = words.map(cap).join(' ');
  return name.length > 30 ? name.slice(0, 27) + '...' : name;
}

function suggestionsFor(input) {
  const t = input.trim();
  if (!t) return ['Analyze sales performance for this quarter', 'Show delivery efficiency metrics', 'Review inventory levels and trends'];
  if (t.length > 100) return [];
  const l = t.toLowerCase();
  if (l.indexOf('sales') > -1 || l.indexOf('revenue') > -1) return [t + ' with year-over-year comparison', t + ' by product category', t + ' and identify top performers'];

  P('I can show which months and states dipped, which is usually the first place an event like that shows up. June was the weakest month (−11.3%), and Florida contributes $480K of state revenue.')
];
const R_HELP = [
  P('Here’s what I can help with on the CSI Dashboard:'),
  L('Revenue: ', 'monthly revenue, expenses, profit and growth.'),
  L('Geography: ', 'revenue by state.'),
  L('Categories: ', 'which beverage categories are leading or lagging.'),
  L('Operations: ', 'store counts, analytics adoption, and your alert rules.'),
  P('Try typing @ to point me at a specific chart or metric.')
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = {};
    this.uid = 100;
    this.state = {
      page: 'dashboard',
      sidebarOpen: true, dashOpen: true, maintOpen: true,
      historyOpen: false,
      fabOpen: false, fabView: 'home',
      history: SEED_HISTORY.slice(),
      conv: { main: this.blankConv(), fab: this.blankConv() },
      donutPick: null,
      alerts: SEED_ALERTS.slice(), alertSearch: '', alertSev: 'all', alertStatus: 'all',
      users: SEED_USERS.slice(), userSearch: '', userPlatform: 'all', userStatus: 'all', selected: [],
      menu: null, dialog: null
    };
  }

  componentWillUnmount() {
    Object.keys(this.timers).forEach(function (k) { clearInterval(this.timers[k]); clearTimeout(this.timers[k + 'wait']); }, this);
  }

  blankConv() {
    return { messages: [], input: '', mentions: [], files: [], thinking: false, streamId: null, shown: 0, title: '', mentionOpen: false, mentionQuery: '' };
  }

  patchConv(key, patch) {
    this.setState(function (s) {
      const c = Object.assign({}, s.conv[key], typeof patch === 'function' ? patch(s.conv[key]) : patch);
      const conv = Object.assign({}, s.conv); conv[key] = c;
      return { conv: conv };
    });
  }

  nextId() { this.uid += 1; return 'id' + this.uid; }

  // ---------- chat engine ----------
  pickResponse(text, mentionNames) {
    const q = (text + ' ' + mentionNames.join(' ')).toLowerCase();
    const page = this.state.page;
    if (/summar/.test(q)) return this.pageSummary(page);
    if (/insight/.test(q)) return this.pageInsight(page);
    if (/hurricane|weather|storm/.test(q)) return R_WEATHER;
    if (/deliver|route|shipping|logistic/.test(q)) return R_DELIVERY;
    if (/alert|stock|inventory|oos|downtime|complain/.test(q)) return this.alertsAnswer();
    if (/user|adoption|login|seat|analytics users/.test(q)) return this.usersAnswer();
    if (/state|region|geo|california|texas|new york|florida/.test(q)) return R_STATES;
    if (/categor|product|drink|beverage|energy|soda|vendor/.test(q)) return R_CATEGORIES;
    if (/sales|revenue|profit|expense|month|growth|quarter|trend/.test(q)) return R_REVENUE;
    if (/store|retailer|kpi|metric|dashboard|csi|overview/.test(q)) return this.kpiAnswer();
    return R_HELP;
  }

  kpiAnswer() {
    return [
      H('CSI Dashboard at a glance'),
      L('Footprint: ', '28 retailers and 47,520 stores.'),
      L('Store health: ', '93.4% of stores are active, roughly 44,400 locations.'),
      L('Analytics adoption: ', 'only 38.6% of 653 analytics users are active, about 252 people.'),
      P('Store coverage is strong. The bigger opportunity is getting more analytics users to log in regularly.')
    ];
  }

  alertsAnswer() {
    const a = this.state.alerts;
    const active = a.filter(function (x) { return x.status === 'Active'; });
    const off = a.filter(function (x) { return x.status !== 'Active'; });
    const critOff = off.filter(function (x) { return x.severity === 'Critical'; });
    const blocks = [H('Alert rules'), P(active.length + ' of ' + a.length + ' alert rules are active.')];
    active.forEach(function (x) { blocks.push(L(x.name + ' (' + x.severity + '): ', x.trigger + '.')); });
    if (critOff.length) blocks.push(P('Heads up: ' + critOff.map(function (x) { return x.name; }).join(', ') + ' is your only Critical rule, and it’s switched off. You won’t hear about slow API responses until someone notices manually.'));
    else if (off.length) blocks.push(P('Inactive: ' + off.map(function (x) { return x.name; }).join(', ') + '.'));
    return blocks;
  }

  usersAnswer() {
    const u = this.state.users;
    const count = function (k, v) { return u.filter(function (x) { return x[k] === v; }).length; };
    return [
      H('User access'),
      P(u.length + ' users are listed in Maintenance.'),
      L('Active: ', count('status', 'Active') + '.'),
      L('Pending: ', count('status', 'Pending') + (count('status', 'Pending') ? ', waiting on invite acceptance.' : '.')),
      L('Inactive: ', count('status', 'Inactive') + '.'),
      L('By platform: ', 'GlobalWorx ' + count('platform', 'GlobalWorx') + ', Acuity ' + count('platform', 'Acuity') + ', Insights ' + count('platform', 'Insights') + '.'),
      P('Across the wider org, 38.6% of 653 analytics users are active, so following up on pending invites is an easy win.')
    ];
  }

  pageSummary(page) {
    if (page === 'alerts') return this.alertsAnswer();
    if (page === 'users') return this.usersAnswer();
    if (page === 'tessa') return R_HELP;
    return [
      H('Summary of the CSI Dashboard'),
      L('Network: ', '28 retailers, 47,520 stores, 93.4% active.'),
      L('Revenue: ', '$802K for the year, with $318K net profit and December the best month.'),
      L('Geography: ', 'California, New York and Texas drive 55% of state revenue.'),
      L('Categories: ', 'Carbonated Soft Drinks lead at 89%; Premium Mixers trail at 39%.'),
      P('The one number I’d flag: only 38.6% of analytics users are active.')
    ];
  }

  pageInsight(page) {
    if (page === 'alerts') return this.alertsAnswer();
    if (page === 'users') return this.usersAnswer();
    return [
      H('Quick insight'),
      P('Expenses are growing almost as fast as revenue. Margin stayed between 38% and 42% all year, so the growth is real but isn’t getting more efficient.'),
      L('Revenue: ', '+111% from January to December.'),
      L('Expenses: ', '+96% over the same period.'),
      P('Want me to look for the months where expenses outpaced revenue?')
    ];
  }

  send(key, override) {
    const c = this.state.conv[key];
    const text = (override != null ? override : c.input).trim();
    if (!text || c.thinking || c.streamId) return;
    const mentions = override != null ? [] : c.mentions;
    const files = override != null ? [] : c.files;
    const msg = { id: this.nextId(), role: 'user', text: text, mentions: mentions, files: files };
    this.patchConv(key, function (cc) {
      return { messages: cc.messages.concat([msg]), input: '', mentions: [], files: [], thinking: true, mentionOpen: false, title: cc.messages.length ? cc.title : chatName(text) };
    });
    if (key === 'fab') this.setState({ fabView: 'chat' });
    const self = this;
    const names = mentions.map(function (m) { return m.name; });
    this.timers[key + 'wait'] = setTimeout(function () { self.respond(key, text, names); }, 900);
  }

  respond(key, text, names) {
    const blocks = this.pickResponse(text, names);
    const total = blocks.reduce(function (n, b) { return n + b.lead.length + b.text.length; }, 0);
    const id = this.nextId();
    this.patchConv(key, function (cc) {
      return { thinking: false, streamId: id, shown: 0, messages: cc.messages.concat([{ id: id, role: 'assistant', blocks: blocks, total: total }]) };
    });
    const self = this;
    clearInterval(this.timers[key]);
    this.timers[key] = setInterval(function () {
      const cc = self.state.conv[key];
      if (cc.streamId !== id) { clearInterval(self.timers[key]); return; }
      const next = cc.shown + 5;
      if (next >= total) {
        clearInterval(self.timers[key]);
        self.patchConv(key, { shown: total, streamId: null });
      } else {
        self.patchConv(key, { shown: next });
      }
    }, 22);
  }

  stop(key) {
    clearTimeout(this.timers[key + 'wait']);
    clearInterval(this.timers[key]);
    const self = this;
    this.patchConv(key, function (cc) {
      if (cc.thinking) return { thinking: false };
      if (!cc.streamId) return {};
      const messages = cc.messages.map(function (m) {
        if (m.id !== cc.streamId) return m;
        return Object.assign({}, m, { blocks: self.cut(m.blocks, cc.shown), stopped: true });
      });
      return { messages: messages, streamId: null };
    });
  }

  cut(blocks, shown) {
    const out = [];
    let left = shown;
    for (let i = 0; i < blocks.length && left > 0; i++) {
      const b = blocks[i];
      const lead = b.lead.slice(0, left); left -= lead.length;
      const text = b.text.slice(0, Math.max(0, left)); left -= text.length;
      out.push({ kind: b.kind, lead: lead, text: text });
    }
    return out;
  }

  newChat(key) {
    clearTimeout(this.timers[key + 'wait']);
    clearInterval(this.timers[key]);
    const conv = Object.assign({}, this.state.conv); conv[key] = this.blankConv();
    this.setState({ conv: conv, historyOpen: false });
    if (key === 'fab') this.setState({ fabView: 'home' });
  }

  // ---------- view model for one conversation ----------
  convVM(key) {
    const c = this.state.conv[key];
    const self = this;
    const busy = !!(c.thinking || c.streamId);
    const q = c.mentionQuery.trim().toLowerCase();
    const picked = c.mentions.map(function (m) { return m.id; });
    const pool = MENTIONS.filter(function (m) {
      return picked.indexOf(m.id) < 0 && (!q || (m.name + ' ' + m.description + ' ' + m.category).toLowerCase().indexOf(q) > -1);
    });
    const groups = [];
    pool.forEach(function (m) {
      let g = groups.filter(function (x) { return x.name === m.category; })[0];
      if (!g) { g = { name: m.category, items: [] }; groups.push(g); }
      g.items.push({ name: m.name, description: m.description, pick: function () {
        self.patchConv(key, function (cc) { return { mentions: cc.mentions.concat([m]), mentionOpen: false, mentionQuery: '' }; });
      } });
    });

    const msgs = c.messages.map(function (m) {
      if (m.role === 'user') {
        return {
          isUser: true, isAssistant: false, text: m.text,
          hasMentions: m.mentions.length > 0,
          mentionsText: m.mentions.map(function (x) { return '@' + x.name; }).join(', '),
          hasFiles: m.files.length > 0, files: m.files.map(function (f) { return { name: f }; }),
          blocks: [], streaming: false, stopped: false
        };
      }
      const live = m.id === c.streamId;
      const blocks = (live ? self.cut(m.blocks, c.shown) : m.blocks).map(function (b) {
        return { isH: b.kind === 'h', isP: b.kind === 'p', isLi: b.kind === 'li', lead: b.lead, text: b.text };
      });
      return { isUser: false, isAssistant: true, blocks: blocks, streaming: live, stopped: !!m.stopped, text: '', hasMentions: false, hasFiles: false, files: [], mentionsText: '' };
    });

    return {
      isPrompt: c.messages.length === 0 && !c.thinking,
      isChat: c.messages.length > 0 || c.thinking,
      msgs: msgs, thinking: c.thinking,
      input: c.input,
      placeholder: key === 'fab' ? 'Ask Tessa about this page…' : 'Ask Tessa anything. Type @ to mention a chart or metric',
      busy: busy, idle: !busy,
      sendDisabled: !c.input.trim(),
      sendBg: c.input.trim() ? '#00866A' : '#94A3B8',
      sendCursor: c.input.trim() ? 'pointer' : 'not-allowed',
      mentionOpen: c.mentionOpen, mentionAria: c.mentionOpen ? 'true' : 'false',
      mentionQuery: c.mentionQuery, mentionGroups: groups, noMentions: groups.length === 0,
      hasChips: c.mentions.length + c.files.length > 0,
      mentionChips: c.mentions.map(function (m) {
        return { name: m.name, remove: function () { self.patchConv(key, function (cc) { return { mentions: cc.mentions.filter(function (x) { return x.id !== m.id; }) }; }); } };
      }),
      fileChips: c.files.map(function (f, i) {
        return { name: f, remove: function () { self.patchConv(key, function (cc) { return { files: cc.files.filter(function (_, j) { return j !== i; }) }; }); } };
      }),
      onInput: function (e) { self.patchConv(key, { input: e.target.value }); },
      onKey: function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); self.send(key); }
        else if (e.key === '@') { e.preventDefault(); self.patchConv(key, { mentionOpen: true, mentionQuery: '' }); }
        else if (e.key === 'Escape') { self.patchConv(key, { mentionOpen: false }); }
      },
      onMentionQuery: function (e) { self.patchConv(key, { mentionQuery: e.target.value }); },
      onMentionKey: function (e) { if (e.key === 'Escape') self.patchConv(key, { mentionOpen: false }); },
      toggleMention: function () { self.patchConv(key, function (cc) { return { mentionOpen: !cc.mentionOpen, mentionQuery: '' }; }); },
      onFiles: function (e) {
        const names = Array.prototype.map.call(e.target.files || [], function (f) { return f.name; });
        e.target.value = '';
        if (names.length) self.patchConv(key, function (cc) { return { files: cc.files.concat(names) }; });
      },
      send: function () { self.send(key); },
      stop: function () { self.stop(key); },
      newChat: function () { self.newChat(key); },
      newChatFromSheet: function () { self.newChat(key); }
    };
  }

  openFromHistory(key, h) {
    this.newChat(key);
    const self = this;
    setTimeout(function () {
      self.send(key, h.prompt);
      self.patchConv(key, { title: h.title });
    }, 0);
    if (key === 'main') this.setState({ historyOpen: false });
  }

  go(page) { this.setState({ page: page, menu: null, fabOpen: false }); }

  // ---------- render ----------
  renderVals() {
    const s = this.state;
    const self = this;
    const page = s.page;
    const open = s.sidebarOpen;
    const activeColor = '#00B289', idle = '#C3CCD5';
    const m = this.convVM('main');
    const f = this.convVM('fab');

    // charts
    const maxV = 95000;
    const months = MONTHS.map(function (x) {
      const up = x.growth >= 0;
      return {
        month: x.month,
        revH: Math.max(x.value / maxV * 100, 2) + '%',
        expH: Math.max(x.expense / maxV * 100, 2) + '%',
        tipBottom: 'calc(' + (x.value / maxV * 100) + '% + 6px)',
        revLabel: usd(x.value), expLabel: usd(x.expense),
        revShort: k$(x.value), expShort: k$(x.expense),
        profitLabel: usd(x.value - x.expense),
        growthLabel: (up ? '+' : '') + x.growth.toFixed(1) + '%',
        growthBg: up ? '#047857' : '#DC2626',
        growthText: up ? '#047857' : '#B91C1C'
      };
    });
    const totalState = STATES.reduce(function (n, r) { return n + r[2]; }, 0);
    let angle = 0;
    const stops = [];
    const states = STATES.map(function (r, i) {
      const deg = r[2] / totalState * 360;
      const a0 = angle + 1, a1 = angle + deg - 1;
      stops.push('#ffffff ' + angle + 'deg ' + a0 + 'deg', DONUT[i] + ' ' + a0 + 'deg ' + a1 + 'deg', '#ffffff ' + a1 + 'deg ' + (angle + deg) + 'deg');
      angle += deg;
      const picked = s.donutPick === r[1];
      return {
        name: r[0], code: r[1], color: DONUT[i], valueLabel: '$' + r[2] + 'K',
        pct: (r[2] / totalState * 100).toFixed(1) + '%',
        barW: (r[2] / 890 * 100) + '%',
        legendBg: picked ? '#F1F5F9' : 'transparent',
        pressed: picked ? 'true' : 'false',
        pick: function () { self.setState({ donutPick: picked ? null : r[1] }); }
      };
    });
    const pickedState = STATES.filter(function (r) { return r[1] === s.donutPick; })[0];
    const donutCenter = pickedState
      ? { label: pickedState[0], value: '$' + pickedState[2] + 'K', sub: (pickedState[2] / totalState * 100).toFixed(1) + '% of total' }
      : { label: 'Total', value: '$4.1M', sub: '8 states' };
    const categories = CATEGORIES.map(function (c) { return { label: c[0], value: c[1], w: c[1] + '%' }; });

    // alerts
    const aq = s.alertSearch.trim().toLowerCase();
    const sevStyle = {
      Critical: ['#DC2626', '#FFFFFF', '#DC2626'], High: ['#00866A', '#FFFFFF', '#00866A'],
      Medium: ['#F1F5F9', '#0F172A', '#F1F5F9'], Low: ['#FFFFFF', '#0F172A', '#CBD5E1']
    };
    const alertRows = s.alerts.filter(function (a) {
      return (!aq || (a.name + ' ' + a.trigger).toLowerCase().indexOf(aq) > -1) &&
        (s.alertSev === 'all' || a.severity.toLowerCase() === s.alertSev) &&
        (s.alertStatus === 'all' || a.status.toLowerCase() === s.alertStatus);
    }).map(function (a) {
      const on = a.status === 'Active';
      const sv = sevStyle[a.severity] || sevStyle.Low;
      const menuOpen = s.menu === 'a' + a.id;
      return {
        name: a.name, trigger: a.trigger, severity: a.severity, status: a.status,
        ariaOn: on ? 'true' : 'false', trackBg: on ? '#00866A' : '#CBD5E1', knobX: on ? '16px' : '0px',
        sevBg: sv[0], sevColor: sv[1], sevBorder: sv[2],
        statusBg: on ? '#E6F7F2' : '#F1F5F9', statusColor: on ? '#00664F' : '#475569',
        menuOpen: menuOpen, menuAria: menuOpen ? 'true' : 'false',
        toggle: function () { self.setState(function (st) { return { alerts: st.alerts.map(function (x) { return x.id === a.id ? Object.assign({}, x, { status: x.status === 'Active' ? 'Inactive' : 'Active' }) : x; }) }; }); },
        openMenu: function () { self.setState({ menu: menuOpen ? null : 'a' + a.id }); },
        edit: function () { self.setState({ menu: null, dialog: { kind: 'alert', editId: a.id, error: '', form: { name: a.name, trigger: a.trigger, severity: a.severity } } }); },
        remove: function () { self.setState(function (st) { return { menu: null, alerts: st.alerts.filter(function (x) { return x.id !== a.id; }) }; }); }
      };
    });

    // users
    const uq = s.userSearch.trim().toLowerCase();
    const plat = { GlobalWorx: ['#E0F7FC', '#005F73'], Acuity: ['#DFF5E8', '#00662A'], Insights: ['#DCF7EF', '#00664F'] };
    const stat = { Active: ['#E6F7F2', '#00664F'], Inactive: ['#F1F5F9', '#475569'], Pending: ['#FEF3C7', '#92400E'] };
    const visibleUsers = s.users.filter(function (u) {
      return (!uq || (u.firstName + ' ' + u.lastName + ' ' + u.email).toLowerCase().indexOf(uq) > -1) &&
        (s.userPlatform === 'all' || u.platform.toLowerCase() === s.userPlatform) &&
        (s.userStatus === 'all' || u.status.toLowerCase() === s.userStatus);
    });
    const userRows = visibleUsers.map(function (u) {
      const checked = s.selected.indexOf(u.id) > -1;
      const menuOpen = s.menu === 'u' + u.id;
      const pc = plat[u.platform] || plat.Insights, sc = stat[u.status] || stat.Inactive;
      return {
        firstName: u.firstName, lastName: u.lastName, email: u.email, platform: u.platform, status: u.status,
        platBg: pc[0], platColor: pc[1], statusBg: sc[0], statusColor: sc[1],
        checked: checked, menuOpen: menuOpen, menuAria: menuOpen ? 'true' : 'false',
        toggle: function () { self.setState(function (st) { return { selected: checked ? st.selected.filter(function (x) { return x !== u.id; }) : st.selected.concat([u.id]) }; }); },
        openMenu: function () { self.setState({ menu: menuOpen ? null : 'u' + u.id }); },
        edit: function () { self.setState({ menu: null, dialog: { kind: 'user', editId: u.id, error: '', form: Object.assign({}, u) } }); },
        remove: function () { self.setState(function (st) { return { menu: null, users: st.users.filter(function (x) { return x.id !== u.id; }), selected: st.selected.filter(function (x) { return x !== u.id; }) }; }); }
      };
    });
    const allSelected = visibleUsers.length > 0 && visibleUsers.every(function (u) { return s.selected.indexOf(u.id) > -1; });

    // dialog
    const d = s.dialog;
    const setForm = function (field) {
      return function (e) { const v = e.target.value; self.setState(function (st) { const form = Object.assign({}, st.dialog.form); form[field] = v; return { dialog: Object.assign({}, st.dialog, { form: form, error: '' }) }; }); };
    };
    const form = d ? Object.assign({}, d.form, {
      setName: setForm('name'), setTrigger: setForm('trigger'), setSeverity: setForm('severity'),
      setFirst: setForm('firstName'), setLast: setForm('lastName'), setEmail: setForm('email'),
      setPlatform: setForm('platform'), setStatus: setForm('status')
    }) : {};

    // history
    const history = s.history.map(function (h) {
      return {
        title: h.title, ago: h.ago,
        openM: function () { self.openFromHistory('main', h); },
        openF: function () { self.openFromHistory('fab', h); },
        remove: function () { self.setState(function (st) { return { history: st.history.filter(function (x) { return x.id !== h.id; }) }; }); }
      };
    });

    const titles = { dashboard: 'CSI Dashboard', alerts: 'Alerts', users: 'Users', tessa: m.isChat ? (s.conv.main.title || 'New Chat') : 'Tessa' };
    const fabConvTitle = s.conv.fab.title || 'New Chat';

    return {
      sideW: open ? '280px' : '64px', sideMax: open ? '100%' : '64px',
      sidebarOpen: open, sidebarClosed: !open,
      navJustify: open ? 'flex-start' : 'center', subIndent: open ? '16px' : '0px',
      dashRot: s.dashOpen ? '90deg' : '0deg', maintRot: s.maintOpen ? '90deg' : '0deg',
      dashOpenAria: s.dashOpen ? 'true' : 'false', maintOpenAria: s.maintOpen ? 'true' : 'false',
      showDashSub: s.dashOpen || !open, showMaintSub: s.maintOpen || !open,
      nav: {
        dashColor: page === 'dashboard' ? activeColor : idle, dashCurrent: page === 'dashboard' ? 'page' : 'false',
        tessaColor: page === 'tessa' ? activeColor : idle, tessaCurrent: page === 'tessa' ? 'page' : 'false',
        alertsColor: page === 'alerts' ? activeColor : idle, alertsCurrent: page === 'alerts' ? 'page' : 'false',
        usersColor: page === 'users' ? activeColor : idle, usersCurrent: page === 'users' ? 'page' : 'false'
      },
      toggleSidebar: function () { self.setState({ sidebarOpen: !s.sidebarOpen }); },
      toggleDash: function () { if (open) self.setState({ dashOpen: !s.dashOpen }); else self.go('dashboard'); },
      toggleMaint: function () { if (open) self.setState({ maintOpen: !s.maintOpen }); else self.go('users'); },
      goDashboard: function () { self.go('dashboard'); },
      goTessa: function () { self.go('tessa'); },
      goAlerts: function () { self.go('alerts'); },
      goUsers: function () { self.go('users'); },

      pageTitle: titles[page],
      isDashboard: page === 'dashboard', isTessa: page === 'tessa', isAlerts: page === 'alerts', isUsers: page === 'users',
      showNewChatBtn: page === 'tessa' && m.isChat,
      openHistory: function () { self.setState({ historyOpen: true }); },
      closeHistory: function () { self.setState({ historyOpen: false }); },
      historyOpen: s.historyOpen, historyAria: s.historyOpen ? 'true' : 'false',

      kpis: KPIS, months: months, states: states, categories: categories,
      netProfit: '$318,000', avgProfit: '$26,500', bestMonth: 'Dec',
      donutStops: stops.join(', '), donutCenter: donutCenter,

      m: m, f: f,
      autoScrollPage: page === 'tessa' && (s.conv.main.thinking || !!s.conv.main.streamId),

>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{fabIsHistory}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex: 1; overflow-y: auto; padding: 12px 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n  <sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"6\">\n    <div class=\"hist\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 2px; color: #64748B\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\/path><\/svg>\n      <button class=\"histopen\" onClick=\"{{h.openF}}\"><span style=\"display: block; font-size: 14px; font-weight: 600\">{{h.title}}<\/span><span style=\"display: block; margin-top: 2px; font-size: 12px; color: #64748B\">{{h.ago}}<\/span><\/button>\n      <button class=\"icon del\" aria-label=\"Delete {{h.title}}\" onClick=\"{{h.remove}}\" style=\"width: 32px; height: 32px\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18\"><\/path><path d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\"><\/path><path d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\"><\/path><\/svg><\/button>\n    <\/div>\n  <\/sc-for>\n  <sc-if value=\"{{noHistory}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; padding: 12px; font-size: 14px; color: #64748B\">No previous chats.<\/p><\/sc-if>\n<\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{fabNotHistory}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 0 12px 12px\">\n<div style=\"position: relative\">\n  <sc-if value=\"{{f.mentionOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 40; max-height: 320px; overflow-y: auto; padding: 8px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 16px 40px rgba(15,23,42,.16)\">\n      <label for=\"f-mq\" class=\"sr-only\">Search mentions<\/label>\n      <input id=\"f-mq\" class=\"field\" style=\"height: 38px; font-size: 14px\" placeholder=\"Search dashboards, charts, metrics\u2026\" value=\"{{f.mentionQuery}}\" onChange=\"{{f.onMentionQuery}}\" onKeyDown=\"{{f.onMentionKey}}\"/>\n      <sc-for list=\"{{f.mentionGroups}}\" as=\"g\" hint-placeholder-count=\"2\">\n        <div style=\"padding: 10px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #64748B\">{{g.name}}<\/div>\n        <sc-for list=\"{{g.items}}\" as=\"mi\" hint-placeholder-count=\"2\">\n          <button class=\"mitem\" onClick=\"{{mi.pick}}\"><span style=\"font-size: 14px; font-weight: 600\">{{mi.name}}<\/span><span style=\"font-size: 13px; color: #64748B\">{{mi.description}}<\/span><\/button>\n        <\/sc-for>\n      <\/sc-for>\n      <sc-if value=\"{{f.noMentions}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; padding: 12px 10px; font-size: 14px; color: #64748B\">No matches.<\/p><\/sc-if>\n    <\/div>\n  <\/sc-if>\n  <div class=\"composer\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px 8px 8px 16px; background: #fff; border: 1px solid #CBD5E1; border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.06)\">\n    <sc-if value=\"{{f.hasChips}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 6px; padding-right: 8px\">\n        <sc-for list=\"{{f.mentionChips}}\" as=\"ch\" hint-placeholder-count=\"1\">\n          <span style=\"display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: #E6F7F2; color: #00664F; font-size: 13px; font-weight: 600\">@{{ch.name}}<button class=\"chipx\" aria-label=\"Remove {{ch.name}}\" onClick=\"{{ch.remove}}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"><\/path><path d=\"m6 6 12 12\"><\/path><\/svg><\/button><\/span>\n        <\/sc-for>\n        <sc-for list=\"{{f.fileChips}}\" as=\"fc\" hint-placeholder-count=\"1\">\n          <span style=\"display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: 6px; background: #F1F5F9; color: #334155; font-size: 13px\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\/path><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\/path><\/svg>{{fc.name}}<button class=\"chipx\" aria-label=\"Remove {{fc.name}}\" onClick=\"{{fc.remove}}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"><\/path><path d=\"m6 6 12 12\"><\/path><\/svg><\/button><\/span>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <label for=\"f-ta\" class=\"sr-only\">Message Tessa<\/label>\n    <textarea id=\"f-ta\" class=\"ta\" rows=\"2\" placeholder=\"{{f.placeholder}}\" value=\"{{f.input}}\" onChange=\"{{f.onInput}}\" onKeyDown=\"{{f.onKey}}\"><\/textarea>\n    <div style=\"display: flex; align-items: center; justify-content: space-between\">\n      <div style=\"display: flex; align-items: center; gap: 2px\">\n        <button class=\"icon\" title=\"Mention (@)\" aria-label=\"Mention a dashboard, chart or metric\" aria-expanded=\"{{f.mentionAria}}\" onClick=\"{{f.toggleMention}}\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\/circle><path d=\"M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8\"><\/path><\/svg><\/button>\n        <label class=\"icon\" title=\"Attach files\" style=\"cursor: pointer\"><input type=\"file\" multiple=\"multiple\" class=\"sr-only\" onChange=\"{{f.onFiles}}\"/><span class=\"sr-only\">Attach files<\/span><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48\"><\/path><\/svg><\/label>\n      <\/div>\n      <sc-if value=\"{{f.busy}}\" hint-placeholder-val=\"{{ false }}\">\n        <button aria-label=\"Stop generating\" onClick=\"{{f.stop}}\" style=\"width: 36px; height: 36px; border: 0; border-radius: 50%; background: #0F172A; color: #fff; display: flex; align-items: center; justify-content: center\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect width=\"14\" height=\"14\" x=\"5\" y=\"5\" rx=\"2\" fill=\"currentColor\"><\/rect><\/svg><\/button>\n      <\/sc-if>\n      <sc-if value=\"{{f.idle}}\" hint-placeholder-val=\"{{ true }}\">\n        <button aria-label=\"Send message\" onClick=\"{{f.send}}\" disabled=\"{{f.sendDisabled}}\" style=\"width: 36px; height: 36px; border: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; background: {{f.sendBg}}; cursor: {{f.sendCursor}}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 7-7 7 7\"><\/path><path d=\"M12 19V5\"><\/path><\/svg><\/button>\n      <\/sc-if>\n    <\/div>\n  <\/div>\n<\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n<\/sc-if>\n\n\n<sc-if value=\"{{dialogOpen}}\" hint-placeholder-val=\"{{ false }}\">\n  <button aria-label=\"Close dialog\" onClick=\"{{closeDialog}}\" style=\"position: fixed; inset: 0; z-index: 80; border: 0; background: rgba(15,23,42,.45); cursor: default\"><\/button>\n  <div role=\"dialog\" aria-label=\"{{dialogTitle}}\" class=\"in\" style=\"position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 81; width: min(460px, calc(100vw - 32px)); background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(15,23,42,.3); padding: 24px; display: flex; flex-direction: column; gap: 16px; font-family: 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif; color: #0F172A\">\n    <h2 style=\"margin: 0; font-size: 20px; font-weight: 600\">{{dialogTitle}}<\/h2>\n    <sc-if value=\"{{dialogIsAlert}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-name\" style=\"font-size: 14px; font-weight: 600\">Name<\/label><input id=\"d-name\" class=\"field\" placeholder=\"e.g. Low Stock Alert\" value=\"{{form.name}}\" onChange=\"{{form.setName}}\"/><\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-trigger\" style=\"font-size: 14px; font-weight: 600\">Trigger<\/label><input id=\"d-trigger\" class=\"field\" placeholder=\"e.g. Inventory &lt; 100 units\" value=\"{{form.trigger}}\" onChange=\"{{form.setTrigger}}\"/><\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-sev\" style=\"font-size: 14px; font-weight: 600\">Severity<\/label>\n        <select id=\"d-sev\" class=\"field\" value=\"{{form.severity}}\" onChange=\"{{form.setSeverity}}\"><option>Critical<\/option><option>High<\/option><option>Medium<\/option><option>Low<\/option><\/select><\/div>\n    <\/sc-if>\n    <sc-if value=\"{{dialogIsUser}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-first\" style=\"font-size: 14px; font-weight: 600\">First name<\/label><input id=\"d-first\" class=\"field\" value=\"{{form.firstName}}\" onChange=\"{{form.setFirst}}\"/><\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-last\" style=\"font-size: 14px; font-weight: 600\">Last name<\/label><input id=\"d-last\" class=\"field\" value=\"{{form.lastName}}\" onChange=\"{{form.setLast}}\"/><\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-email\" style=\"font-size: 14px; font-weight: 600\">Email<\/label><input id=\"d-email\" type=\"email\" class=\"field\" placeholder=\"name@company.com\" value=\"{{form.email}}\" onChange=\"{{form.setEmail}}\"/><\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-plat\" style=\"font-size: 14px; font-weight: 600\">Platform<\/label><select id=\"d-plat\" class=\"field\" value=\"{{form.platform}}\" onChange=\"{{form.setPlatform}}\"><option>GlobalWorx<\/option><option>Acuity<\/option><option>Insights<\/option><\/select><\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"d-ustatus\" style=\"font-size: 14px; font-weight: 600\">Status<\/label><select id=\"d-ustatus\" class=\"field\" value=\"{{form.status}}\" onChange=\"{{form.setStatus}}\"><option>Active<\/option><option>Inactive<\/option><option>Pending<\/option><\/select><\/div>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{formError}}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin: 0; font-size: 14px; color: #B91C1C\">{{formErrorText}}<\/p>\n    <\/sc-if>\n    <div style=\"display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px\">\n      <button class=\"outline\" onClick=\"{{closeDialog}}\">Cancel<\/button>\n      <button class=\"primary\" onClick=\"{{saveDialog}}\">{{dialogCta}}<\/button>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<\/div>\n", Component);
</script>
